        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float 2.6s ease-in-out infinite; }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in { animation: popIn 0.28s ease-out; }

        @keyframes scoreReveal {
          0% { transform: translateY(8px) scale(0.92); opacity: 0; }
          65% { transform: translateY(-2px) scale(1.05); opacity: 1; }
          100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-score-reveal { animation: scoreReveal 0.42s ease-out; }

        body { overscroll-behavior-y: none; }
        canvas { touch-action: none; }

        const encodeAvatar = (source) => {

        function useAudio() {
          const ctxRef = useRef(null);

            if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
            if (ctxRef.current.state === 'suspended') ctxRef.current.resume();
          }, []);
          const playTone = useCallback((freq, type, duration, vol = 0.1) => {
            if (!ctxRef.current) return;
            const ctx = ctxRef.current;
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(vol, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + duration);
          }, []);
          return {
            initAudio: init,
            playClick: useCallback(() => playTone(800, 'sine', 0.05, 0.05), [playTone]),
            playSuccess: useCallback(() => {
              playTone(523.25, 'sine', 0.1, 0.1); setTimeout(() => playTone(659.25, 'sine', 0.1, 0.1), 100);
              setTimeout(() => playTone(783.99, 'sine', 0.2, 0.15), 200); setTimeout(() => playTone(1046.50, 'sine', 0.4, 0.2), 300);

            if (canvas.width === pixelWidth && canvas.height === pixelHeight) {
              canvasCssSizeRef.current = { width: cssWidth, height: cssHeight };
              if (!preserveDrawing) {
                const ctx = canvas.getContext('2d');
                ctx.setTransform(1, 0, 0, 1, 0, 0);

                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

            let snapshotCanvas = null;
            if (preserveDrawing && canvas.width > 0 && canvas.height > 0) {

              snapshotCanvas.height = canvas.height;

            const { cssWidth, cssHeight } = getCanvasMetrics(canvas);
            const displayAspect = cssWidth / cssHeight;
            const pixelAspect = canvas.width / canvas.height;

            if (Math.abs(displayAspect - pixelAspect) < 0.001) {
              return canvas.toDataURL('image/png');
            }

            const exportWidth = canvas.width;
            const exportHeight = Math.max(1, Math.round(exportWidth / displayAspect));
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = exportWidth;
            exportCanvas.height = exportHeight;

            const exportCtx = exportCanvas.getContext('2d');
            exportCtx.fillStyle = '#ffffff';
            exportCtx.fillRect(0, 0, exportWidth, exportHeight);

            return exportCanvas.toDataURL('image/png');

          // Jeder Undo-Schritt merkt sich, ob schon ein Foto im Bild war - sonst
          // könnte "Rückgängig" nach "Neu" ein Foto ohne KI-Umwandlung zurückholen.
          const pushUndo = () => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            snapshot.photoUsed = avatarPhotoUsedRef.current;

            if (!canvas) return;

            pushUndo();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            setGeneratedImageUrl('');
            markAvatarPhotoUsed(false);
          };

          const pointFromEvent = (event) => {
            const canvas = canvasRef.current;
            const { cssWidth, cssHeight, offsetLeft, offsetTop } = getCanvasMetrics(canvas);
            const scaleX = canvas.width / cssWidth;
            const scaleY = canvas.height / cssHeight;
            const cssX = clamp(event.clientX - offsetLeft, 0, cssWidth);
            const cssY = clamp(event.clientY - offsetTop, 0, cssHeight);
            return {
              x: cssX * scaleX,
              y: cssY * scaleY
            };
          };

          const drawSegment = (start, end, isErasing = false) => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const { width } = canvasCssSizeRef.current;
            const scale = width ? (canvas.width / width) : 1;
            ctx.strokeStyle = isErasing ? '#ffffff' : brushColor;
            ctx.lineWidth = (isErasing ? Math.max(brushSize, 12) : brushSize) * scale;
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
          };

          const fillCanvasAtPoint = (point) => {
            const canvas = canvasRef.current;
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const x = clamp(Math.floor(point.x), 0, width - 1);
            const y = clamp(Math.floor(point.y), 0, height - 1);
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const startIndex = (y * width + x) * 4;

            const targetR = data[startIndex];
            const targetG = data[startIndex + 1];
            const targetB = data[startIndex + 2];
            const targetA = data[startIndex + 3];
            const fillColor = hexToRgb(brushColor);

            if (targetR === fillColor.r && targetG === fillColor.g && targetB === fillColor.b && targetA === 255) {
              return;
            }

            const matchesTarget = (index) => (
              data[index] === targetR &&
              data[index + 1] === targetG &&
              data[index + 2] === targetB &&
              data[index + 3] === targetA
            );

            const stack = [[x, y]];

            while (stack.length) {
              const [currentX, currentY] = stack.pop();
              if (currentX < 0 || currentY < 0 || currentX >= width || currentY >= height) continue;

              const index = (currentY * width + currentX) * 4;
              if (!matchesTarget(index)) continue;

              data[index] = fillColor.r;
              data[index + 1] = fillColor.g;
              data[index + 2] = fillColor.b;
              data[index + 3] = 255;

              stack.push([currentX + 1, currentY]);
              stack.push([currentX - 1, currentY]);
              stack.push([currentX, currentY + 1]);
              stack.push([currentX, currentY - 1]);
            }

            ctx.putImageData(imageData, 0, 0);
            setGeneratedImageUrl('');
          };

          const undoLastAction = () => {
            const canvas = canvasRef.current;
            if (!canvas || !undoStackRef.current.length) return;
            const ctx = canvas.getContext('2d');
            const previousState = undoStackRef.current.pop();
            if (!previousState) return;
            ctx.putImageData(previousState, 0, 0);
            setCanUndo(undoStackRef.current.length > 0);
            setGeneratedImageUrl('');
            markAvatarPhotoUsed(Boolean(previousState.photoUsed));

            const isErasing = isEraserPointerEvent(event);
            erasingRef.current = isErasing;

            if (tool === 'fill' && !isErasing) {
              fillCanvasAtPoint(point);
              drawingRef.current = false;
              lastPointRef.current = null;
              return;
            }

            drawingRef.current = true;
            lastPointRef.current = point;
            drawSegment(point, point, isErasing);

              const mimeType = parts?.[1] || 'image/png';
              const response = await fetch(url);
              const blob = await response.blob();
              const extension = extensionFromMime(mimeType);
              downloadBlob(blob, `${fileBaseName}.${extension}`);
              return;

            try {
              const response = await fetch(url);
              if (!response.ok) throw new Error('Download fehlgeschlagen.');
              const blob = await response.blob();
              const extension = extensionFromMime(blob.type);
              downloadBlob(blob, `${fileBaseName}.${extension}`);
            } catch {

          const evaluateDrawing = async () => {

              const prompt = `Du bist ein KI-Bildbewerter für Kinderzeichnungen. Aufgabe: "Male ${currentTask.prompt}".
                    Bewerte, wie gut die Zeichnung zur Aufgabe passt.
                    Außerdem soll die Qualität (Farben, Details) der Zeichnung berücksichtigt werden.

              const result = await callOpenRouter({

            const maybeText = choice.content;

              if (match) return match[0];

            return '';

                model: imageEditModel,
                messages: [
                  {
                    role: 'user',
                    content: requestContent
                  }
                ]
              });

              const generatedUrl = extractGeneratedImageUrl(result);
              if (!generatedUrl) {
                throw new Error('Die KI hat kein Bild zurückgegeben. Prüfe Modell/API-Key.');
              }

              await updateDoc(doc(db, DB_COLLECTIONS.profiles, activeProfileId), {
                coins: (profile.coins || 0) - AI_EDIT_COST
              });

              setGeneratedImageUrl(generatedUrl);

              try {
                const promptSlug = sanitizeFilenamePart(currentTask?.prompt, 'motiv');
                const modelSlug = sanitizeFilenamePart(imageEditModel, 'ki-modell');
                const userSlug = sanitizeFilenamePart(profile?.name, 'spieler');
                await downloadUrl(generatedUrl, `${fileTimestamp()}-malatelier-${userSlug}-${promptSlug}-${modelSlug}-zauberbild`);
              } catch (downloadError) {
                setErrorText(downloadError.message || 'KI-Bild erstellt, aber automatisches Speichern ist fehlgeschlagen.');
              }
            } catch (err) {
              console.error(err);
              setErrorText(err.message || 'KI-Bild konnte nicht erstellt werden.');
            } finally {
              setIsGeneratingImage(false);
              setIsBusy(false);
            }
          };

          // --- SONDERAUFGABE: MEIN AVATAR ---
          const openAvatarTask = () => {
            initAudio(); playClick();
            setAvatarResultUrl('');
            setAvatarNotice('');
            setAvatarCrop(null);
            setErrorText('');
            setTool('brush');
            markAvatarPhotoUsed(false);
            undoStackRef.current = [];
            setCanUndo(false);
            setScreen('avatar');
          };

          const requestPhoto = () => {
            playClick();
            setErrorText('');
            if (isPhotoUnlocked) {
              photoInputRef.current?.click();
              return;
            }
            setPhotoGate({ a: 11 + Math.floor(Math.random() * 9), b: 11 + Math.floor(Math.random() * 9), answer: '', wrong: false });
          };

          // Eltern-Frage: Das Foto geht zur Umwandlung an den KI-Dienst, das sollen Erwachsene freigeben.
          const confirmPhotoGate = () => {
            if (!photoGate) return;
            if (Number(photoGate.answer) !== photoGate.a * photoGate.b) {
              setPhotoGate({ ...photoGate, answer: '', wrong: true });
              return;
            }
            setIsPhotoUnlocked(true);
            setPhotoGate(null);
            photoInputRef.current?.click();
          };

          const onPhotoSelected = async (event) => {
            const file = event.target.files?.[0];
            event.target.value = '';
            if (!file) return;
            try {
              setAvatarCrop({ src: await blobToDataUrl(file), target: 'photo' });
            } catch (err) {
              setErrorText(err.message);
            }
          };

          const saveAvatarImage = async (avatarImage) => {
            if (!activeProfileId) return;
            await updateDoc(doc(db, DB_COLLECTIONS.profiles, activeProfileId), { avatarImage });
            playTada();
            setAvatarNotice(avatarImage ? 'saved' : 'removed');
          };

          const onAvatarCropConfirm = async (croppedCanvas) => {
            const target = avatarCrop?.target;
            setAvatarCrop(null);
            try {
              setErrorText('');
              if (target === 'photo') {
                const canvas = canvasRef.current;
                if (!canvas) return;
                pushUndo();
                canvas.getContext('2d').drawImage(croppedCanvas, 0, 0, canvas.width, canvas.height);
                markAvatarPhotoUsed(true);
                return;
              }
              await saveAvatarImage(encodeAvatar(croppedCanvas));
            } catch (err) {
              console.error(err);
              setErrorText(err.message || 'Avatar konnte nicht gespeichert werden.');
            }
          };

          const saveDrawingAsAvatar = async () => {
            if (avatarPhotoUsed) {
              setErrorText('Fotos werden nur als KI-Cartoon gespeichert. Nutze den KI-Zauber!');
              return;
            }
            try {
              setErrorText('');
              await saveAvatarImage(encodeAvatar(canvasRef.current));
            } catch (err) {
              console.error(err);
              setErrorText(err.message || 'Avatar konnte nicht gespeichert werden.');
            }
          };

          const removeAvatar = async () => {
            playClick();
            try {
              await saveAvatarImage('');
            } catch (err) {
              setErrorText(err.message || 'Avatar konnte nicht entfernt werden.');
            }
          };

          // Fotos machen das PNG schnell mehrere MB groß - für die KI reicht ein 768er JPEG.
          const getAvatarSourceDataUrl = () => {
            const canvas = canvasRef.current;
            const out = document.createElement('canvas');
            out.width = 768;
            out.height = 768;
            out.getContext('2d').drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, 768, 768);
            return out.toDataURL('image/jpeg', 0.9);
          };

          const createAvatarWithAi = async () => {
            if (!profile || !activeProfileId || isBusy) return;

            if ((profile.coins || 0) < AI_EDIT_COST) {
              setErrorText(`Du brauchst mindestens ${AI_EDIT_COST} Münzen für den KI-Zauber.`);
              return;
            }

            try {
              setIsBusy(true);
              setIsGeneratingImage(true);
              setErrorText('');
              setAvatarNotice('');

              const style = AVATAR_STYLES.find((entry) => entry.key === avatarStyleKey);
              const prompt = (avatarPrompt || '').trim() || buildAvatarPrompt(style, avatarPhotoUsed);
              const result = await callOpenRouter({
                model: imageEditModel,
                messages: [
                  {
                    role: 'user',
                    content: [
                      { type: 'text', text: prompt },
                      { type: 'image_url', image_url: { url: getAvatarSourceDataUrl() } }
                    ]
                  }
                ]
              });

              const generatedUrl = extractGeneratedImageUrl(result);
              if (!generatedUrl) {
                throw new Error('Die KI hat kein Bild zurückgegeben. Prüfe Modell/API-Key.');
              }
              const resultDataUrl = await ensureDataUrl(generatedUrl);

              await updateDoc(doc(db, DB_COLLECTIONS.profiles, activeProfileId), {
                coins: (profile.coins || 0) - AI_EDIT_COST
              });

              playSuccess();
              setAvatarResultUrl(resultDataUrl);
            } catch (err) {
              console.error(err);
              setErrorText(err.message || 'KI-Avatar konnte nicht erstellt werden.');
            } finally {
              setIsGeneratingImage(false);
              setIsBusy(false);
            }
          };

          const finishGame = async (finalScore) => {
            const coins = Math.floor(finalScore / 10);
            setEarnedCoins(coins);

            if (profile && activeProfileId) {
              await updateDoc(doc(db, DB_COLLECTIONS.profiles, activeProfileId), {
                coins: (profile.coins || 0) + coins
              });
            }

            setResultText(finalScore >= 600 ? 'Wow, du bist ein echter Mal-Profi! 🎨' : 'Super gemalt! Jede Runde macht dich besser. ✨');
            playTada(); setScreen('result');
          };

          const nextRound = async () => {
            if (!hasRoundScored) {
              setErrorText('Bitte zuerst KI-Bewertung durchführen.');
              return;
            }

            const isLastRound = roundIndex >= roundTasks.length - 1;
            if (isLastRound) {
              await finishGame(score);
              return;
            }

            setRoundIndex((prev) => prev + 1);
            setFeedback('');
            setLastRoundScore(0);
            setLastRoundEmoji('');
            setLastRoundComment('');
            setHasRoundScored(false);
            setErrorText('');
            setGeneratedImageUrl('');
            undoStackRef.current = [];
            setCanUndo(false);
          };

          const selectProfile = (profileId) => {

          // Werkzeugleiste fürs Malen - im Spiel über dem Bild, beim Avatar darunter.

            <div className="pointer-events-auto flex flex-nowrap items-center gap-2 bg-white/70 backdrop-blur-md p-1 shadow-lg rounded-2xl border-2 border-slate-200/50">
              <button onClick={() => setTool('brush')} title="Stift" className={`w-12 h-12 flex items-center justify-center rounded-xl text-2xl transition-all ${tool === 'brush' ? 'bg-indigo-500 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}>🖌️</button>
              <button onClick={() => setTool('fill')} title="Fill" className={`w-12 h-12 flex items-center justify-center rounded-xl text-2xl transition-all ${tool === 'fill' ? 'bg-indigo-500 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}>🪣</button>
              <div className="w-px h-8 bg-slate-200 mx-1"></div>
              <button onClick={undoLastAction} disabled={!canUndo} title="Undo" className="w-12 h-12 flex items-center justify-center rounded-xl text-xl text-slate-600 hover:bg-amber-100 disabled:opacity-30 disabled:hover:bg-transparent transition-colors">↩️</button>
              <button onClick={clearCanvas} title="Neu" className="w-12 h-12 flex items-center justify-center rounded-xl text-xl text-slate-600 hover:bg-red-100 transition-colors">🧽</button>

              <div className="relative">

                  onClick={() => { setIsPaletteOpen(!isPaletteOpen); setIsThicknessOpen(false); }}

                  <div className="w-8 h-8 rounded-full border-2 border-slate-300 shadow-sm" style={{ backgroundColor: brushColor }}></div>

                          style={{ backgroundColor: color }}

                        />
                      ))}
                    </div>
                  </div>

              </div>

              <div className="relative">

                      <div className="w-10 h-10 flex items-center justify-center bg-slate-50 rounded-full border border-slate-100 shadow-inner">
                        <div className="rounded-full bg-slate-700" style={{ width: Math.min(brushSize, 30), height: Math.min(brushSize, 30) }}></div>
                      </div>
                      <input
                        type="range"
                        min="2"
                        max="40"
                        value={brushSize}
                        onChange={(event) => setBrushSize(Number(event.target.value))}

                    </div>
                  </div>

              </div>
            </div>

                    {profiles.map((p) => (
                      <button

                        className="bg-slate-50 hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-300 rounded-2xl p-4 flex flex-col items-center gap-2 transition-all active:scale-95"
                      >
                        <ProfileAvatar profile={p} size={56} />
                        <div className="font-bold text-slate-700 text-lg truncate w-full">{p.name}</div>
                      </button>

                  </div>

                  <button
                    onClick={() => { playClick(); setScreen('setup'); }}
                    className="w-full bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 border-2 border-indigo-200 border-dashed"
                  >
                    <Users size={20} /> Neuen Spieler hinzufügen
                  </button>

                  {errorText && <p className="mt-4 text-sm text-red-500 font-semibold">{errorText}</p>}
                </div>

          if (screen === 'setup') {

              <div className="min-h-screen bg-indigo-100 flex flex-col items-center justify-center p-4 font-sans">
                <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-8 text-center border-4 border-indigo-200 animate-pop-in">
                  <h1 className="text-3xl font-black text-indigo-700 mb-2">Neues Profil</h1>
                  <p className="text-slate-500 font-medium mb-6 text-sm">Nutze denselben Namen wie in Zahlen-Safari/Lese-Fuchs für gemeinsame Münzen.</p>

                  <div className="mb-6">
                    <label className="block text-left font-bold text-slate-700 mb-2">Dein Name:</label>

                      className="w-full bg-slate-50 border-2 border-indigo-200 rounded-xl px-4 py-3 font-bold text-slate-800 text-xl focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div className="mb-8">
                    <label className="block text-left font-bold text-slate-700 mb-2">Wähle dein Tier:</label>
                    <div className="grid grid-cols-5 gap-2 bg-slate-50 p-3 rounded-xl border-2 border-slate-100">
                      {AVATAR_POOL.map((avatar) => (
                        <button
                          key={avatar}
                          onClick={() => { playClick(); setSetupAvatar(avatar); }}
                          className={`aspect-square text-3xl flex items-center justify-center rounded-lg transition-all ${setupAvatar === avatar ? 'bg-indigo-200 scale-110 shadow-sm' : 'hover:bg-slate-200 opacity-70 hover:opacity-100'}`}
                        >
                          {avatar}
                        </button>
                      ))}

                  <button

                    disabled={!setupName.trim()}
                    className="w-full bg-green-500 hover:bg-green-600 disabled:bg-slate-300 text-white font-black text-xl py-4 rounded-2xl"
                  >
                    Start!
                  </button>

                  {profiles.length > 0 && (
                    <button onClick={() => { playClick(); setScreen('profile_select'); }} className="mt-4 text-slate-500 font-bold hover:text-slate-700 underline">
                      Abbrechen
                    </button>
                  )}

              </div>

          }

          if (screen === 'start') {
            return (

                <TopBar />

                <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-2xl p-8 text-center border-4 border-indigo-200 animate-pop-in">
                  <div className="text-7xl mb-4 animate-float">🎨</div>
                  <h1 className="text-4xl font-black text-slate-800 mb-2">Mal-<span className="text-indigo-600">Atelier</span></h1>
                  <p className="text-slate-600 font-medium mb-2">Male die vorgegebene Aufgabe und lass die KI dein Bild bewerten.</p>

                  <div className="bg-indigo-50 border-2 border-indigo-100 rounded-2xl p-4 mb-4 text-left">
                    <p className="font-bold text-indigo-800 mb-1">So funktioniert's:</p>

                      <li>• Male das Motiv mit Farbe und Strichdicke deiner Wahl.</li>
                      <li>• KI bewertet dein Bild und du erhältst Punkte je nach Schwierigkeit.</li>
                      <li>• Für die Gesamtpunkte bekommst du Münzen.</li>

                    </ul>
                  </div>

                  <div className="bg-indigo-50 border-2 border-indigo-100 rounded-2xl p-4 mb-6 text-left">
                    <p className="font-bold text-indigo-800 mb-3">Schwierigkeit</p>

                        <button

                          className={`rounded-xl border-2 px-3 py-3 font-black transition ${selectedDifficulty === option.key ? 'bg-indigo-500 text-white border-indigo-500' : 'bg-white text-slate-700 border-indigo-100 hover:bg-indigo-100'}`}
                        >
                          <span className="mr-2" aria-hidden="true">{option.symbol}</span>

                  <div className="bg-gradient-to-r from-fuchsia-50 to-amber-50 border-2 border-fuchsia-200 rounded-2xl p-4 mb-6 flex items-center gap-4 text-left">
                    <div className="w-16 h-16 rounded-full bg-white border-4 border-fuchsia-200 flex items-center justify-center shrink-0 overflow-hidden">

                          <button
                            onClick={requestNewTask}
                            disabled={isBusy}
                            className="ml-2 align-middle bg-white hover:bg-indigo-50 disabled:opacity-40 text-indigo-600 text-base font-bold px-3 py-1 rounded-full border-2 border-indigo-200 shadow-sm transition-colors"
                            title="Anderes Motiv"
                          >
                            🔄 Neues Motiv
                          </button>
                        )}
                      </span>
                    </p>

                    <div className="relative bg-slate-100 rounded-2xl p-1 border-2 border-slate-200 mb-4 h-[600px] md:h-[650px] overflow-hidden flex flex-col items-stretch">
                      <canvas
                        ref={canvasRef}
                        onPointerDown={(e) => { setIsPaletteOpen(false); setIsThicknessOpen(false); onPointerDown(e); }}
                        onPointerMove={onPointerMove}
                        onPointerUp={onPointerUp}
                        onPointerLeave={onPointerUp}
                        onPointerCancel={onPointerUp}
                        className="w-full h-full bg-white rounded-xl touch-none shrink-0 grow border-4 border-slate-300"
                        style={{ cursor: tool === 'fill' ? 'crosshair' : 'default' }}
                      />

                      {/* Bottom Overlay Bar */}
                      <div className="absolute bottom-4 left-4 right-4 pointer-events-none z-10">
                        <div className="pointer-events-none mx-auto w-full flex justify-center overflow-visible">
                          {renderDrawToolbar()}
                        </div>
                      </div>
                    </div>

                    {(feedback || hasRoundScored || lastRoundComment) && (
                      <div key={`${roundIndex}-${lastRoundScore}-${feedback}`} className="bg-indigo-100 text-indigo-900 p-5 rounded-3xl mb-3 border-2 border-indigo-200 animate-score-reveal">
                        {feedback && !hasRoundScored && <p className="font-black text-xl md:text-2xl leading-tight">{feedback}</p>}
                        {hasRoundScored && (
                          <div className="mt-2 flex items-center justify-center gap-3">
                            <ScoreRing score={lastRoundScore} max={currentTask?.maxPoints || 100} />
                            <div className="w-16 h-16 rounded-full bg-white/70 border-2 border-indigo-200 flex items-center justify-center text-3xl" aria-label="Bewertungs-Emoji">
                              {lastRoundEmoji || scoreToEmoji(lastRoundScore)}
                            </div>
                          </div>
                        )}
                        {lastRoundComment && <p className="text-base mt-2">{lastRoundComment}</p>}
                      </div>
                    )}

                    {generatedImageUrl && (
                      <div className="bg-fuchsia-50 border border-fuchsia-200 p-4 rounded-2xl mb-3">
                        <p className="font-black text-fuchsia-900 mb-2">Dein KI-Zauberbild</p>
                        <img src={generatedImageUrl} alt="KI-Zauberbild" className="w-full h-auto rounded-xl border-2 border-fuchsia-200" />
                        <button
                          onClick={saveGeneratedImage}
                          className="mt-3 w-full bg-fuchsia-500 hover:bg-fuchsia-600 text-white font-bold py-2 rounded-xl"
                        >
                          KI-Bild speichern
                        </button>
                      </div>
                    )}

                    {errorText && <p className="text-red-500 font-semibold text-sm mt-2">{errorText}</p>}

                    <div className="grid grid-cols-[auto,1fr,auto] items-end gap-3 mt-4">
                      <button
                        onClick={() => { playClick(); setScreen('start'); }}
                        className="bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-5 rounded-full shadow"
                        aria-label="Zurück zur Startseite"
                        title="Zurück"
                      >
                        ⬅️
                      </button>

                      <div className="flex flex-col items-center gap-2">
                        <div className="flex flex-wrap items-center justify-center gap-2">
                          <button
                            onClick={saveOwnDrawing}
                            className="bg-white hover:bg-emerald-50 text-emerald-600 border-2 border-emerald-200 font-bold py-2 px-4 rounded-xl shadow flex items-center gap-2 transition-colors"
                          >
                            <span>💾</span> Speichern
                          </button>

                          <button
                            onClick={evaluateDrawing}
                            disabled={isBusy || hasRoundScored}
                            className="bg-indigo-500 hover:bg-indigo-600 disabled:bg-slate-400 text-white font-black py-2 px-4 rounded-xl shadow border border-indigo-400 disabled:border-slate-400 transition-all"
                          >
                            {isBusy && !isGeneratingImage ? '⏳ Bewertet...' : hasRoundScored ? '✅ Bewertet' : '🤖 Bewerten'}
                          </button>

                          <div className="relative">
                            <button
                              onClick={createAiImageVariant}
                              disabled={isBusy}
                              className="bg-fuchsia-500 hover:bg-fuchsia-600 disabled:bg-slate-400 text-white font-black py-2 px-3 text-sm rounded-xl shadow border border-fuchsia-400 disabled:border-slate-400 transition-all flex items-center gap-1"
                            >
                              {isGeneratingImage ? '⏳ Zaubern...' : <>🪄 KI-Zauber <span className="opacity-80 font-semibold px-1 bg-white/20 rounded">-{AI_EDIT_COST}🪙</span></>}
                            </button>
                            <button
                              onClick={() => setIsAiAdvancedOpen((prev) => !prev)}
                              className="absolute -top-2 -right-2 w-7 h-7 rounded-full bg-white text-fuchsia-700 border-2 border-fuchsia-300 shadow flex items-center justify-center text-xs font-black hover:bg-fuchsia-50"
                              title="Erweiterte KI-Einstellungen"
                              aria-label="Erweiterte KI-Einstellungen"
                            >
                              ⚙️
                            </button>
                          </div>
                        </div>

                        {isAiAdvancedOpen && (
                          <div className="w-72 max-w-[80vw] bg-white border border-fuchsia-200 rounded-xl p-2 shadow-lg">
                            <label className="block text-[11px] font-bold text-fuchsia-700 mb-1">Freies KI-Malen Prompt</label>
                            <textarea
                              value={aiImagePrompt}
                              onChange={(event) => setAiImagePrompt(event.target.value)}
                              rows={4}
                              className="w-full resize-y rounded-lg border border-fuchsia-200 px-2 py-1 text-xs text-slate-700"
                              placeholder="Beschreibe hier selbst, wie die KI dein Bild umwandeln soll."
                            />

                            <label className="mt-2 flex items-center gap-2 text-xs text-slate-700 font-semibold">
                              <input
                                type="checkbox"
                                checked={includeSourceImageForAi}
                                onChange={(event) => setIncludeSourceImageForAi(event.target.checked)}
                                className="accent-fuchsia-500"
                              />
                              Eigenes Bild mitsenden
                            </label>
                          </div>
                        )}
                      </div>

                      <button
                        onClick={nextRound}
                        className="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-6 rounded-full shadow"
                        aria-label={roundIndex >= roundTasks.length - 1 ? 'Runde abschließen' : 'Nächste Aufgabe'}
                        title={roundIndex >= roundTasks.length - 1 ? 'Runde abschließen' : 'Nächste Aufgabe'}
                      >
                        {roundIndex >= roundTasks.length - 1 ? '🏁' : '➡️'}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          if (screen === 'avatar') {
            const fliegerLink = `../zahlen-flieger/index.html?profile=${encodeURIComponent(activeProfileId || '')}`;

            return (
              <div className="min-h-screen bg-fuchsia-50 relative flex flex-col items-center justify-center p-4 pt-24 font-sans">
                <TopBar />

                <div className="bg-white rounded-[2rem] shadow-2xl border border-fuchsia-100 w-full max-w-3xl p-6 md:p-8 animate-pop-in">
                  <p className="text-3xl md:text-4xl font-black text-slate-800 leading-tight mb-1">🧑‍🎨 Male dich selbst!</p>
                  <p className="text-slate-600 font-medium mb-4">Alles im Kreis wird dein Avatar. Male dein Gesicht groß in die Mitte.</p>

                  <div className="relative w-full max-w-[560px] mx-auto aspect-square">
                    <canvas
                      ref={canvasRef}
                      onPointerDown={(e) => { setIsPaletteOpen(false); setIsThicknessOpen(false); onPointerDown(e); }}
                      onPointerMove={onPointerMove}
                      onPointerUp={onPointerUp}
                      onPointerLeave={onPointerUp}
                      onPointerCancel={onPointerUp}
                      className="w-full h-full bg-white rounded-2xl touch-none border-4 border-slate-300"
                      style={{ cursor: tool === 'fill' ? 'crosshair' : 'default' }}
                    />
                    {/* Alles außerhalb des Kreises abgedunkelt: das wird nicht Teil des Avatars. */}
                    <div
                      className="absolute inset-[4px] rounded-xl pointer-events-none"
                      style={{ background: 'radial-gradient(circle closest-side, transparent 99%, rgba(15, 23, 42, 0.18) 100%)' }}
                    />
                    <div className="absolute inset-[4px] rounded-full border-4 border-dashed border-fuchsia-300 pointer-events-none" />
                  </div>

                  <div className="flex justify-center mt-3">{renderDrawToolbar()}</div>

                  <div className="flex flex-wrap justify-center gap-2 mt-4">
                    <button
                      onClick={requestPhoto}
                      className="bg-white hover:bg-sky-50 text-sky-700 border-2 border-sky-200 font-bold py-2 px-4 rounded-xl shadow"
                    >
                      📷 Foto einfügen
                    </button>
                    <button
                      onClick={saveDrawingAsAvatar}
                      disabled={isBusy || avatarPhotoUsed}
                      title={avatarPhotoUsed ? 'Fotos werden nur als KI-Cartoon gespeichert' : 'Die Zeichnung direkt als Avatar nehmen'}
                      className="bg-green-500 hover:bg-green-600 disabled:bg-slate-300 text-white font-black py-2 px-4 rounded-xl shadow"
                    >
                      ✅ Zeichnung als Avatar
                    </button>
                  </div>
                  {avatarPhotoUsed && (
                    <p className="text-center text-xs font-bold text-sky-700 mt-2">Mit Foto geht es nur über den KI-Zauber: gespeichert wird der Cartoon, nicht das Foto.</p>
                  )}
                  <input ref={photoInputRef} type="file" accept="image/*" className="hidden" onChange={onPhotoSelected} />

                  <div className="bg-fuchsia-50 border-2 border-fuchsia-100 rounded-2xl p-4 mt-5">
                    <div className="flex items-center justify-between gap-2 mb-3">
                      <p className="font-black text-fuchsia-900">🪄 KI-Avatar: Wie möchtest du aussehen?</p>
                      <button
                        onClick={() => setIsAvatarPromptOpen((prev) => !prev)}
                        className="w-8 h-8 rounded-full bg-white text-fuchsia-700 border-2 border-fuchsia-300 shadow flex items-center justify-center text-xs font-black hover:bg-fuchsia-100 shrink-0"
                        title="Prompt bearbeiten"
                        aria-label="Prompt bearbeiten"
                      >
                        ⚙️
                      </button>
                    </div>
                    <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
                      {AVATAR_STYLES.map((style) => (
                        <button
                          key={style.key}
                          onClick={() => { playClick(); setAvatarStyleKey(style.key); }}
                          className={`rounded-xl border-2 px-2 py-2 font-bold text-sm flex flex-col items-center gap-1 transition ${avatarStyleKey === style.key ? 'bg-fuchsia-500 text-white border-fuchsia-500' : 'bg-white text-slate-700 border-fuchsia-100 hover:bg-fuchsia-100'}`}
                        >
                          <span className="text-2xl leading-none">{style.icon}</span>
                          {style.label}
                        </button>
                      ))}
                    </div>

                    {isAvatarPromptOpen && (
                      <textarea
                        value={avatarPrompt}
                        onChange={(event) => setAvatarPrompt(event.target.value)}
                        rows={5}
                        className="w-full mt-3 resize-y rounded-lg border border-fuchsia-200 px-2 py-1 text-xs text-slate-700"
                      />
                    )}

                    <button
                      onClick={createAvatarWithAi}
                      disabled={isBusy || isApiKeyMissing}
                      className="mt-3 w-full bg-fuchsia-500 hover:bg-fuchsia-600 disabled:bg-slate-400 text-white font-black py-3 rounded-xl shadow flex items-center justify-center gap-2"
                    >
                      {isGeneratingImage ? '⏳ Zaubern...' : <>🪄 KI-Avatar zaubern <span className="opacity-80 font-semibold px-1 bg-white/20 rounded">-{AI_EDIT_COST}🪙</span></>}
                    </button>
                    {isApiKeyMissing && <p className="text-xs font-bold text-red-600 mt-2">Für den KI-Zauber fehlt der OpenRouter API-Key (KI-Einstellungen auf der Startseite).</p>}

                    {avatarResultUrl && (
                      <div className="mt-4 flex flex-col sm:flex-row items-center gap-4">
                        <img src={avatarResultUrl} alt="KI-Avatar" className="w-40 h-40 rounded-full object-cover border-4 border-fuchsia-300 bg-white shadow" />
                        <div className="flex-1 w-full space-y-2">
                          <button
                            onClick={() => { playClick(); setAvatarCrop({ src: avatarResultUrl, target: 'result' }); }}
                            className="w-full bg-green-500 hover:bg-green-600 text-white font-black py-3 rounded-xl shadow"
                          >
                            ✅ Als Avatar nehmen
                          </button>
                          <p className="text-xs text-slate-500 font-semibold text-center">Gefällt dir nicht? Ändere die Zeichnung oder den Stil und zaubere nochmal.</p>
                        </div>
                      </div>
                    )}
                  </div>

                  {avatarNotice === 'saved' && profile?.avatarImage && (
                    <div className="mt-5 bg-green-50 border-2 border-green-200 rounded-2xl p-4 flex flex-col sm:flex-row items-center gap-4 animate-score-reveal">
                      <img src={profile.avatarImage} alt="Dein Avatar" className="w-24 h-24 rounded-full border-4 border-white shadow bg-white" />
                      <div className="flex-1 text-center sm:text-left">
                        <p className="font-black text-green-800 text-xl">Dein Avatar ist fertig! 🎉</p>
                        <p className="text-sm text-slate-600 font-medium">Im Zahlen-Flieger kannst du jetzt selbst einsteigen.</p>
                      </div>
                      <a href={fliegerLink} className="bg-sky-500 hover:bg-sky-600 text-white font-black py-3 px-4 rounded-xl shadow shrink-0">✈️ Zum Flieger</a>
                    </div>
                  )}
                  {avatarNotice === 'removed' && <p className="mt-4 text-center font-bold text-slate-600">Avatar entfernt - jetzt siehst du wieder dein Tier {profile?.avatar}.</p>}

                  {errorText && <p className="text-red-500 font-semibold text-sm mt-3 text-center">{errorText}</p>}

                  <div className="flex items-center justify-between gap-3 mt-6">
                    <button
                      onClick={() => { playClick(); setScreen('start'); }}
                      className="bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-5 rounded-full shadow"
                      aria-label="Zurück zur Startseite"
                      title="Zurück"
                    >
                      ⬅️
                    </button>
                    {profile?.avatarImage && (
                      <div className="flex items-center gap-2">
                        <ProfileAvatar profile={profile} size={40} />
                        <button onClick={removeAvatar} disabled={isBusy} className="text-sm text-slate-500 font-bold hover:text-red-600 underline">
                          Avatar entfernen
                        </button>
                      </div>
                    )}
                  </div>
                </div>

                {photoGate && (
                  <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 text-center animate-pop-in">
                      <p className="text-4xl mb-2">👨‍👩‍👧</p>
                      <p className="font-black text-xl text-slate-800 mb-2">Frage für Erwachsene</p>
                      <p className="text-sm text-slate-600 font-medium mb-4 text-left">
                        Ein Foto wird zur Umwandlung an den KI-Dienst (OpenRouter und den gewählten Bildanbieter) geschickt.
                        Gespeichert wird nur der fertige Cartoon-Avatar, nicht das Foto. Bitte zur Freigabe ausrechnen:
                      </p>
                      <p className="font-black text-2xl text-slate-800 mb-2">{photoGate.a} × {photoGate.b} = ?</p>
                      <input
                        type="number"
                        inputMode="numeric"
                        autoFocus
                        value={photoGate.answer}
                        onChange={(event) => setPhotoGate({ ...photoGate, answer: event.target.value, wrong: false })}
                        onKeyDown={(event) => { if (event.key === 'Enter') confirmPhotoGate(); }}
                        className="w-40 mx-auto block bg-slate-50 border-2 border-indigo-200 rounded-xl px-4 py-2 font-bold text-slate-800 text-xl text-center"
                      />
                      {photoGate.wrong && <p className="text-red-500 font-bold text-sm mt-2">Das stimmt leider nicht.</p>}
                      <div className="grid grid-cols-2 gap-2 mt-4">
                        <button onClick={() => setPhotoGate(null)} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl">Abbrechen</button>
                        <button onClick={confirmPhotoGate} className="bg-indigo-500 hover:bg-indigo-600 text-white font-black py-3 rounded-xl">Foto wählen</button>
                      </div>
                    </div>
                  </div>
                )}

                {avatarCrop && (
                  <CircleCropper
                    src={avatarCrop.src}
                    title={avatarCrop.target === 'photo' ? 'Foto einpassen' : 'Avatar-Ausschnitt'}
                    confirmLabel={avatarCrop.target === 'photo' ? 'Einfügen' : 'Speichern'}
                    outputSize={avatarCrop.target === 'photo' ? 1024 : AVATAR_SIZE * 2}
                    onConfirm={onAvatarCropConfirm}
                    onCancel={() => setAvatarCrop(null)}
                  />
                )}
              </div>
            );
          }

          if (screen === 'result') {
            return (
              <div className="min-h-screen bg-yellow-50 relative flex flex-col items-center justify-center p-4 pt-20 font-sans">
                <TopBar />

                <div className="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full border-4 border-yellow-300 text-center animate-pop-in">
                  <div className="text-7xl mb-4 animate-float">🖼️</div>
                  <h1 className="text-4xl font-black text-slate-800 mb-3">Runde fertig!</h1>
                  <p className="text-slate-600 font-semibold mb-6">{resultText}</p>

                  <div className="bg-yellow-100 rounded-2xl p-5 mb-6 border border-yellow-200">
                    <p className="text-slate-700 font-bold">Deine Punkte</p>
                    <p className="text-5xl font-black text-yellow-600 mt-1">{score}</p>
                  </div>

                  <div className="bg-indigo-50 rounded-2xl p-4 mb-6 border border-indigo-100">
                    <p className="text-slate-700 font-bold">Münzen aus dieser Runde</p>
                    <p className="text-3xl font-black text-indigo-600 mt-1">+{earnedCoins} 🪙</p>
                  </div>

                  <button
                    onClick={() => { playClick(); setScreen('start'); }}
                    className="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-black py-4 rounded-2xl mb-3"
                  >
                    Noch eine Runde
                  </button>

                  <a href="../index.html" className="text-slate-500 font-bold hover:text-slate-700 underline">
                    Zurück zum LernKumpel-Menü
                  </a>
                </div>
              </div>
            );
          }

          return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
