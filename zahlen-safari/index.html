        /* ------------------------------------------------------------------ *

        .zs-compact .zs-key {

    <!-- Alte Browser: Fehler sichtbar machen (statt weißer Seite) + fehlende
         Standard-Funktionen nachrüsten. Muss vor allen anderen Skripten laufen. -->
    <script>
      (function () {
        window.__appStarted = false;

        function showError(text) {
          if (window.__appStarted) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="font:16px/1.5 sans-serif;padding:24px;color:#0f172a">' +
            '<p style="font-size:40px;margin:0 0 12px">🦁</p>' +
            '<p style="font-weight:bold;margin:0 0 8px">Die Safari konnte nicht starten.</p>' +
            '<p style="margin:0 0 16px">Dein Browser ist wahrscheinlich zu alt. Bitte Chrome im Play Store aktualisieren.</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;font-size:11px;color:#b91c1c;margin:0">' +
            String(text).replace(/</g, '&lt;') + '</pre></div>';
        }
        window.__showStartError = showError;

        // Syntaxfehler in einem der CDN-Skripte landen hier.
        window.onerror = function (message, url, line) {
          showError(message + '\n' + (url || '') + ':' + (line || ''));
        };
        // Falls ein CDN gar nicht antwortet, bleibt sonst nur "Lädt ...".
        // Großzügig, weil alte Handys ~3 MB Babel erst herunterladen und übersetzen müssen.
        setTimeout(function () {
          if (!window.__appStarted) {
            showError('Zeitüberschreitung beim Laden (React / Babel / Firebase). ' +
              'Vielleicht ist die Internetverbindung zu langsam - bitte neu laden.');
          }
        }, 45000);

        // --- Mini-Polyfills (Chrome < 54) ---
        if (!Object.values) {
          Object.values = function (o) {
            return Object.keys(o).map(function (k) { return o[k]; });
          };
        }
        if (!Array.prototype.includes) {
          Array.prototype.includes = function (v) { return this.indexOf(v) !== -1; };
        }
        if (!String.prototype.includes) {
          String.prototype.includes = function (v) { return this.indexOf(v) !== -1; };
        }
        if (!Array.from) {
          Array.from = function (a) { return Array.prototype.slice.call(a); };
        }
      })();
    </script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase als klassische Skripte ("compat"-API).
         Bewusst KEINE ES-Module + importmap: Import Maps gibt es erst ab Chrome 89,
         alte Browser ignorieren sie und scheitern dann an "firebase/app"
         ("Failed to resolve module specifier") -> die App startete nie. -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <script>
      // Firebase 11 ist ES2018 und lässt sich vor Chrome ~63 nicht parsen.
      // Dann die alte ES5-Version nachladen - gleiche API, gleiche Datenbank.
      if (typeof firebase === 'undefined' || !firebase.auth || !firebase.firestore) {
        document.write(
          '<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"><\/script>' +
          '<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"><\/script>' +
          '<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"><\/script>'
        );
      }
    </script>

    <!-- Kein data-type="module": so übersetzt Babel den Code bis auf ES5-Niveau
         herunter (inkl. ?. und async/await) und braucht keine Modul-Unterstützung. -->
    <script type="text/babel">
        // --- FIREBASE: modulare Namen auf die klassische ("compat") API abbilden ---
        // Firebase ist im <head> als normales Skript geladen (window.firebase), damit
        // die App ohne ES-Module und ohne Import Map läuft. Diese kleine Schicht stellt
        // dieselben Funktionsnamen bereit wie das modulare SDK.
        const initializeApp = (config) => firebase.initializeApp(config);
        const getAuth = (app) => firebase.auth(app);
        const signInAnonymously = (auth) => auth.signInAnonymously();
        const onAuthStateChanged = (auth, cb) => auth.onAuthStateChanged(cb);
        const getFirestore = (app) => firebase.firestore(app);
        const collection = (db, name) => db.collection(name);
        const doc = (db, name, id) => db.collection(name).doc(id);

            lowOsc.frequency.setValueAtTime(220, now);
            lowOsc.frequency.exponentialRampToValueAtTime(72, now + 0.42);

            buzzOsc.type = 'triangle';
            buzzOsc.frequency.setValueAtTime(110, now);
            buzzOsc.frequency.exponentialRampToValueAtTime(48, now + 0.42);
            buzzOsc.detune.setValueAtTime(8, now);

            lowGain.gain.setValueAtTime(0.0001, now);
            lowGain.gain.exponentialRampToValueAtTime(0.18, now + 0.03);
            lowGain.gain.exponentialRampToValueAtTime(0.015, now + 0.42);

            buzzGain.gain.setValueAtTime(0.0001, now);
            buzzGain.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
            buzzGain.gain.exponentialRampToValueAtTime(0.01, now + 0.32);

            lowOsc.connect(lowGain);
            buzzOsc.connect(buzzGain);
            lowGain.connect(lowpass);
            buzzGain.connect(lowpass);
            lowpass.connect(ctx.destination);

            lowOsc.start(now);
            buzzOsc.start(now);
            lowOsc.stop(now + 0.45);
            buzzOsc.stop(now + 0.35);

            const noiseBuffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            for (let i = 0; i < noiseData.length; i++) {
              noiseData[i] = (Math.random() * 2 - 1) * (1 - i / noiseData.length);
            }

            const noiseSource = ctx.createBufferSource();
            const noiseFilter = ctx.createBiquadFilter();
            const noiseGain = ctx.createGain();

            noiseSource.buffer = noiseBuffer;
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(320, now);
            noiseFilter.Q.setValueAtTime(1.4, now);
            noiseGain.gain.setValueAtTime(0.0001, now + 0.015);
            noiseGain.gain.exponentialRampToValueAtTime(0.025, now + 0.03);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);

            noiseSource.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(ctx.destination);
            noiseSource.start(now + 0.015);
            noiseSource.stop(now + 0.1);
          }, []);
          const playHonkSound = useCallback(() => {
            if (!ctxRef.current) return;

            const ctx = ctxRef.current;
            const now = ctx.currentTime;

            const buildHornBlast = (startTime, baseFreq, duration, gainAmount) => {
              const mainOsc = ctx.createOscillator();
              const supportOsc = ctx.createOscillator();
              const lfo = ctx.createOscillator();
              const lfoGain = ctx.createGain();
              const gain = ctx.createGain();
              const filter = ctx.createBiquadFilter();

              mainOsc.type = 'square';
              supportOsc.type = 'sawtooth';
              lfo.type = 'sine';

              mainOsc.frequency.setValueAtTime(baseFreq, startTime);
              supportOsc.frequency.setValueAtTime(baseFreq * 1.015, startTime);
              lfo.frequency.setValueAtTime(13, startTime);
              lfoGain.gain.setValueAtTime(18, startTime);

              gain.gain.setValueAtTime(0.0001, startTime);
              gain.gain.exponentialRampToValueAtTime(gainAmount, startTime + 0.015);
              gain.gain.exponentialRampToValueAtTime(gainAmount * 0.72, startTime + duration * 0.45);
              gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(980, startTime);
              filter.frequency.exponentialRampToValueAtTime(720, startTime + duration);

              lfo.connect(lfoGain);
              lfoGain.connect(mainOsc.frequency);
              lfoGain.connect(supportOsc.frequency);

              mainOsc.connect(gain);
              supportOsc.connect(gain);
              gain.connect(filter);
              filter.connect(ctx.destination);

              mainOsc.start(startTime);
              supportOsc.start(startTime);
              lfo.start(startTime);

              mainOsc.stop(startTime + duration);
              supportOsc.stop(startTime + duration);
              lfo.stop(startTime + duration);

            buildHornBlast(now, 430, 0.16, 0.08);

              osc.start(now);
              wobble.start(now);
              osc.stop(now + 0.58);

        // --- GLOBALER SKALIERUNGS-HOOK ---
        // Die App wird in einer festen "Design-Fläche" gebaut und als Ganzes skaliert.
        // Die Breite ist fix (448), die HÖHE richtet sich nach dem Fenster - sonst
        // bestimmt auf schmalen Handys die Design-Höhe die Skalierung und links und
        // rechts bleiben große leere Ränder (auf 360x584 z. B. nur 61% Größe).
        const DESIGN_WIDTH = 448;
        const DESIGN_HEIGHT_MIN = 740;  // so flach darf es maximal werden (kompakter Modus)
        const DESIGN_HEIGHT_MAX = 970;  // große Schirme: 970 statt 920, sonst wird der
                                        // "Menü"-Knopf unter dem Ziffernblock abgeschnitten
        const COMPACT_BELOW = 830;      // ab hier flachere Tasten/Anzeige

        function useAppScale() {
          const { useState, useEffect } = React;

          const measure = () => {
            const winW = window.innerWidth;
            const winH = window.innerHeight;

            // 1. So groß wie es die Breite erlaubt ...
            let scale = Math.min(winW / DESIGN_WIDTH, 1.2);
            // 2. ... und die Design-Höhe füllt genau das Fenster.
            let height = winH / scale;

            if (height < DESIGN_HEIGHT_MIN) {
              // Fenster ist zu flach: doch über die Höhe skalieren.
              scale = winH / DESIGN_HEIGHT_MIN;
              height = DESIGN_HEIGHT_MIN;
            } else if (height > DESIGN_HEIGHT_MAX) {
              // Sehr hohes Fenster (Desktop): nicht endlos strecken, mittig zentrieren.
              height = DESIGN_HEIGHT_MAX;
            }

            return { scale, height: Math.round(height), compact: height < COMPACT_BELOW };
          };

          const [layout, setLayout] = useState(measure);

          useEffect(() => {
            const update = () => setLayout(measure());
            update();
            window.addEventListener('resize', update);
            window.addEventListener('orientationchange', update);
            return () => {
              window.removeEventListener('resize', update);
              window.removeEventListener('orientationchange', update);
            };
          }, []);

          return layout;
        }

        // --- VOLLBILD ---
        function useFullscreen() {
          const { useState, useEffect, useCallback } = React;
          const el = document.documentElement;
          const supported = !!(el.requestFullscreen || el.webkitRequestFullscreen);
          const [isFullscreen, setIsFullscreen] = useState(false);

          useEffect(() => {
            const onChange = () => setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement));
            document.addEventListener('fullscreenchange', onChange);
            document.addEventListener('webkitfullscreenchange', onChange);
            return () => {
              document.removeEventListener('fullscreenchange', onChange);
              document.removeEventListener('webkitfullscreenchange', onChange);
            };
          }, []);

          const toggle = useCallback(() => {
            const active = document.fullscreenElement || document.webkitFullscreenElement;
            const run = active
              ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
              : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            // Alte Browser geben nichts zurück, neue ein Promise (kann abgelehnt werden).
            if (run && run.catch) run.catch(() => {});
          }, []);

          return { isFullscreen, supported, toggle };
        }

            if (!profile || treats < 1) return;
            initAudio();
            const before = getPetLevel(petLevels[petId] || 0);
            const nextXp = (petLevels[petId] || 0) + PET_XP_PER_TREAT;
            const after = getPetLevel(nextXp);
            const nextLevels = Object.assign({}, petLevels);
            nextLevels[petId] = nextXp;

            if (after.level > before.level) playTada(); else playCoin();
            await updateDoc(doc(db, DB_COLLECTIONS.profiles, activeProfileId), {
              treats: treats - 1,
              petLevels: nextLevels
            });
          };

          // --- KUNSTSTÜCKE ---
          // Antippen oder Zufall: das Tier macht etwas Unerwartetes. Manchmal findet
          // es dabei sogar Münzen (mit Abklingzeit, damit Dauertippen nichts bringt).
          const runPetTrick = useCallback((pet, spontaneous) => {
            if (!pet) return;
            const petXp = petLevels[pet.id] || 0;
            const levelInfo = getPetLevel(petXp);
            const phrases = (pet.phrases || []).concat(PET_GENERIC_PHRASES);
            const now = Date.now();

            let foundCoins = 0;
            if (now - petCoinCooldownRef.current > 45000 && Math.random() < getPetFindChance(levelInfo.level)) {
              foundCoins = getPetFindAmount(levelInfo.level);
              petCoinCooldownRef.current = now;
            }

            if (!spontaneous) {
              initAudio();
              playSillySound(pet.sound || 'squeak');
            }
            if (foundCoins > 0) playCoin();

            setPetTrick({
              petId: pet.id,
              trickClass: pickRandom(PET_TRICK_CLASSES),
              phrase: foundCoins > 0 ? 'Schau, ' + foundCoins + ' Münzen!' : pickRandom(phrases),
              coins: foundCoins,
              key: now
            });

            if (petTrickTimeoutRef.current) clearTimeout(petTrickTimeoutRef.current);
            petTrickTimeoutRef.current = setTimeout(() => setPetTrick(null), 2400);

            if (!activeProfileId) return;
            const nextLevels = Object.assign({}, petLevels);
            nextLevels[pet.id] = petXp + PET_XP_PER_TRICK;
            const payload = { petLevels: nextLevels };
            if (foundCoins > 0) payload.coins = (profile?.coins || 0) + foundCoins;
            updateDoc(doc(db, DB_COLLECTIONS.profiles, activeProfileId), payload)
              .catch((err) => console.error('Pet trick error:', err));
          }, [petLevels, activeProfileId, profile?.coins, initAudio, playSillySound, playCoin]);

          // Spontane Überraschung im Menü: alle 14-30 Sekunden.
          useEffect(() => {
            if (!activePet || screen !== 'start') return;
            let cancelled = false;
            let timer = null;
            const schedule = () => {
              timer = setTimeout(() => {
                if (cancelled) return;
                runPetTrick(activePet, true);
                schedule();
              }, 14000 + Math.random() * 16000);
            };
            schedule();
            return () => { cancelled = true; if (timer) clearTimeout(timer); };
          }, [activePet?.id, screen, runPetTrick]);

          useEffect(() => () => { if (petTrickTimeoutRef.current) clearTimeout(petTrickTimeoutRef.current); }, []);

          const playToyButtonReward = useCallback((reward) => {
            initAudio();
            playSillySound(reward.sound);
          }, [initAudio, playSillySound]);

          const calculatePerfectSolveBonus = useCallback(() => {
            let pointsEarned = 100;
            if (effectiveGameMode === 'gap') pointsEarned += 20;

            const currentStreak = streak + 1;
            const comboBonus = currentStreak >= 3 ? 30 : 0;
            const secondsTaken = (Date.now() - problemStartTime) / 1000;
            const speedBonus = Math.floor(50 / Math.log2((Math.max(0, secondsTaken) / 4) + 2));

            return { pointsEarned, currentStreak, comboBonus, speedBonus };
          }, [effectiveGameMode, streak, problemStartTime]);

          // --- SPIEL LOGIK ---
          const generateProblem = useCallback((currentLevel, mode, themeId) => {
            let num1, num2, op, answer;
            let ops = [];
            let problemSignature = '';
            let attempts = 0;

            const currentThemeData = THEMES[themeId] || THEMES.classic;
            const randomThemeIcon = () => currentThemeData.problemIcons[Math.floor(Math.random() * currentThemeData.problemIcons.length)];

            const finish = (nextProblem) => {
              setProblem(nextProblem);
              setUserAnswer('');
              setAttemptsLeft(MAX_ATTEMPTS);
              setFeedback(null);
              setLastBonusEarned(0);
              setProblemStartTime(Date.now());
            };

            const kind = getLevelKind(currentLevel);

            // --- UHRZEIT: Zeiger lesen, vierstellig digital eintippen ---
            if (kind === 'clock') {
              let hour = 12;
              let minute = 0;
              do {
                hour = 1 + Math.floor(Math.random() * 12);
                const roll = Math.random();
                if (roll < 0.4) minute = pickRandom([0, 30]);
                else if (roll < 0.7) minute = pickRandom([15, 45]);
                else minute = Math.floor(Math.random() * 12) * 5;
                problemSignature = 'clock' + hour + '-' + minute;
                attempts++;
              } while (sessionProblemsRef.current.has(problemSignature) && attempts < 50);

              if (attempts >= 50) sessionProblemsRef.current.clear();
              sessionProblemsRef.current.add(problemSignature);

              finish({
                kind: 'clock',
                hour,
                minute,
                answer: pad2(hour) + pad2(minute),
                missingPart: 'answer',
                icon: randomThemeIcon()
              });
              return;
            }

            // --- EURO & CENT: Summe, Rückgeld oder mehrmals derselbe Preis ---
            if (kind === 'money') {
              let moneyType = 'sum';
              let aCents = 0;
              let bCents = 0;
              let times = 0;
              let answerCents = 0;

              do {
                moneyType = pickRandom(['sum', 'sum', 'change', 'times']);
                times = 0;
                bCents = 0;

                if (moneyType === 'sum') {
                  aCents = randomPrice(400);
                  bCents = randomPrice(400);
                  answerCents = aCents + bCents;
                } else if (moneyType === 'change') {
                  bCents = pickRandom([200, 500, 1000]);   // bezahlt mit ...
                  aCents = randomPrice(bCents - 10);       // ... für diesen Preis
                  answerCents = bCents - aCents;
                } else {
                  times = 2 + Math.floor(Math.random() * 3);
                  aCents = randomPrice(Math.floor(300 / times));
                  answerCents = aCents * times;
                }

                problemSignature = 'money' + moneyType + '-' + aCents + '-' + bCents + '-' + times;
                attempts++;
              } while (sessionProblemsRef.current.has(problemSignature) && attempts < 50);

              if (attempts >= 50) sessionProblemsRef.current.clear();
              sessionProblemsRef.current.add(problemSignature);

              finish({
                kind: 'money',
                moneyType,
                aCents,
                bCents,
                times,
                answer: answerCents,
                missingPart: 'answer',
                itemA: pickRandom(MONEY_ITEMS),
                itemB: pickRandom(MONEY_ITEMS),
                icon: randomThemeIcon()
              });
              return;
            }

            do {
              switch (currentLevel) {
                case 0:
                  op = '+'; 
                  answer = Math.floor(Math.random() * 11); 
                  num1 = Math.floor(Math.random() * (answer + 1)); 
                  num2 = answer - num1; 
                  break;
                case 0.5:
                  ops = ['+', '-']; op = ops[Math.floor(Math.random() * ops.length)];
                  if (op === '+') { answer = Math.floor(Math.random() * 21); num1 = Math.floor(Math.random() * (answer + 1)); num2 = answer - num1; } 
                  else { num1 = Math.floor(Math.random() * 11); num2 = Math.floor(Math.random() * (num1 + 1)); answer = num1 - num2; }
                  break;
                case 1:
                  ops = ['+', '-']; op = ops[Math.floor(Math.random() * ops.length)];
                  if (op === '+') { answer = Math.floor(Math.random() * 21); num1 = Math.floor(Math.random() * (answer + 1)); num2 = answer - num1; } 
                  else { num1 = Math.floor(Math.random() * 21); num2 = Math.floor(Math.random() * (num1 + 1)); answer = num1 - num2; }
                  break;
                case 2:
                  ops = ['+', '-', '*']; op = ops[Math.floor(Math.random() * ops.length)];
                  if (op === '*') { num1 = Math.floor(Math.random() * 10) + 1; num2 = [2, 5, 10, 3, 4][Math.floor(Math.random() * 5)]; answer = num1 * num2; } 
                  else if (op === '+') { answer = Math.floor(Math.random() * 91) + 10; num1 = Math.floor(Math.random() * (answer + 1)); num2 = answer - num1; } 
                  else { num1 = Math.floor(Math.random() * 91) + 10; num2 = Math.floor(Math.random() * (num1 + 1)); answer = num1 - num2; }
                  break;
                case 3:
                  ops = ['+', '-', '*']; op = ops[Math.floor(Math.random() * ops.length)];
                  if (op === '*') { num1 = Math.floor(Math.random() * 10) + 1; num2 = Math.floor(Math.random() * 10) + 1; answer = num1 * num2; } 
                  else if (op === '+') { num1 = (Math.floor(Math.random() * 50) + 10) * 10; num2 = (Math.floor(Math.random() * 40) + 1) * 10; answer = num1 + num2; } 
                  else { num1 = (Math.floor(Math.random() * 50) + 50) * 10; num2 = (Math.floor(Math.random() * 40) + 10) * 10; answer = num1 - num2; }
                  break;
                case 4:
                default:
                  ops = ['+', '-', '*', '/']; op = ops[Math.floor(Math.random() * ops.length)];
                  if (op === '*') { num1 = Math.floor(Math.random() * 15) + 2; num2 = Math.floor(Math.random() * 8) + 2; answer = num1 * num2; } 
                  else if (op === '/') { num2 = Math.floor(Math.random() * 9) + 2; answer = Math.floor(Math.random() * 20) + 5; num1 = answer * num2; } 
                  else if (op === '+') { num1 = (Math.floor(Math.random() * 50) + 10) * 100; num2 = (Math.floor(Math.random() * 40) + 10) * 100; answer = num1 + num2; } 
                  else { num1 = (Math.floor(Math.random() * 90) + 10) * 100; num2 = (Math.floor(Math.random() * 80) + 1) * 100; if (num2 > num1) { let t = num1; num1 = num2; num2 = t; } answer = num1 - num2; }
                  break;
              }
              problemSignature = `${num1}${op}${num2}`;
              attempts++;
            } while (sessionProblemsRef.current.has(problemSignature) && attempts < 50);
            
            if (attempts >= 50) {
              sessionProblemsRef.current.clear();
            }
            sessionProblemsRef.current.add(problemSignature);

            let missingPart = 'answer';
            if (mode === 'gap') missingPart = ['num1', 'num2'][Math.floor(Math.random() * 2)];

            finish({ kind: 'arith', num1, num2, op, answer, missingPart, icon: randomThemeIcon() });
          }, []);

          const startGame = () => {
            initAudio();
            setScore(0);
            setProblemsDone(0);
            setStreak(0);
            setRoundRank(null);
            setRoundRewards({ coins: 0, sticker: null, adventureStar: 0, unlockedWorlds: [], worldRewardCoins: 0, unusedBonusPoints: 0, bonusUsed: false, boxReward: null, xpGained: 0, rankUps: [], rankUpCoins: 0, treats: 0, petLevelUp: null });
            setRoundBonusAvailable(albumBonusUnlocked);
            setRoundBonusUsed(false);
            generateProblem(level, effectiveGameMode, currentThemeId);
            setScreen('game');
          };

          const getExpectedAnswer = useCallback(() => {
            if (problem.missingPart === 'num1') return problem.num1;
            if (problem.missingPart === 'num2') return problem.num2;
            return problem.answer;
          }, [problem]);

          // Uhrzeit wird als Text verglichen ('0730'), Geld als Cent-Zahl.
          const isAnswerCorrect = useCallback((input) => {
            if (problem.kind === 'clock') return input.length === 4 && input === problem.answer;
            if (problem.kind === 'money') return parseInt(input, 10) === problem.answer;
            return parseInt(input, 10) === getExpectedAnswer();
          }, [problem, getExpectedAnswer]);

          const formatSolution = useCallback(() => {
            if (problem.kind === 'clock') return formatTimeInput(problem.answer);
            if (problem.kind === 'money') return formatCents(problem.answer);
            return String(getExpectedAnswer());
          }, [problem, getExpectedAnswer]);

          const maxInputLength = problem.kind === 'clock' ? 4 : 5;

          const handleGameEnd = async (baseScore, finalStreak, bonusUnusedAtEnd = false) => {
            const unusedBonusPoints = bonusUnusedAtEnd ? BONUS_STAR_ENDGAME_POINTS : 0;
            const finalScore = baseScore + unusedBonusPoints;
            let earnedCoins = Math.floor(finalScore / 10); 
            let newSticker = null;
            let updatedStickers = [...(profile.stickers || [])];
            let earnedAdventureStar = 0;
            let unlockedWorlds = [];
            let worldRewardCoins = 0;

            if (finalStreak === MAX_PROBLEMS) {
              const missingStickers = STICKER_POOL.filter(s => !updatedStickers.includes(s));
              if (missingStickers.length > 0) {
                newSticker = missingStickers[Math.floor(Math.random() * missingStickers.length)];
                updatedStickers.push(newSticker);
                playTada();
              } else {
                earnedCoins += 50;
              }
            }

            const completedAlbumThisRound = hasCompletedStickerAlbum(updatedStickers) && !fullStickerAlbum;

            if (finalStreak === MAX_PROBLEMS && hasCompletedStickerAlbum(updatedStickers)) {
              earnedAdventureStar = 1;
            }

            const previousAdventureStars = profile.adventureStars || 0;
            const nextAdventureStars = previousAdventureStars + earnedAdventureStar;
            const previousCompletedWorlds = getCompletedWorldCount(previousAdventureStars);
            const nextProgress = getAdventureWorldProgress(nextAdventureStars);
            const nextCompletedWorlds = nextProgress.filter((world) => world.completed).length;

            if (nextCompletedWorlds > previousCompletedWorlds) {
              unlockedWorlds = nextProgress.slice(previousCompletedWorlds, nextCompletedWorlds);
              worldRewardCoins = unlockedWorlds.reduce((sum, world) => sum + world.coinReward, 0);
              earnedCoins += worldRewardCoins;
            }

            // --- ENDLOSE RANGLEITER ---
            // Die Rundenpunkte sind gleichzeitig Erfahrungspunkte. Jeder Aufstieg zahlt
            // Münzen und Leckerli - es gibt also immer ein nächstes Ziel.
            const perfectRound = finalStreak === MAX_PROBLEMS;
            const previousXp = profile.xp || 0;
            const xpGained = Math.max(0, finalScore);
            const nextXp = previousXp + xpGained;
            const previousRank = getRankInfo(previousXp).rank;
            const nextRank = getRankInfo(nextXp).rank;
            const rankUps = [];
            let rankUpCoins = 0;
            let earnedTreats = perfectRound ? 1 : 0;

            for (let r = previousRank + 1; r <= nextRank; r++) {
              const reward = getRankUpReward(r);
              const label = getRankLabel(r);
              rankUps.push({ rank: r, title: label.title, icon: label.icon, coins: reward.coins, treats: reward.treats });
              rankUpCoins += reward.coins;
              earnedTreats += reward.treats;
            }
            earnedCoins += rankUpCoins;

            const ticketsBefore = getTickets(profile);
            const ticketsAfter = Math.max(ticketsBefore, Math.min(MAX_TICKETS, ticketsBefore + (perfectRound ? TICKETS_PER_PERFECT_ROUND : TICKETS_PER_ROUND)));

            // --- AKTIVES TIER LERNT MIT ---
            let petLevelUp = null;
            const nextPetLevels = Object.assign({}, petLevels);
            if (activePet) {
              const petXpBefore = petLevels[activePet.id] || 0;
              const petXpAfter = petXpBefore + PET_XP_PER_ROUND + (perfectRound ? PET_XP_PER_PERFECT_ROUND : 0);
              nextPetLevels[activePet.id] = petXpAfter;
              const levelBefore = getPetLevel(petXpBefore);
              const levelAfter = getPetLevel(petXpAfter);
              if (levelAfter.level > levelBefore.level) {
                petLevelUp = { name: activePet.name, icon: activePet.icon, level: levelAfter.level, title: levelAfter.name };
              }
            }

            setRoundRewards({
              coins: earnedCoins,
              sticker: newSticker,
              adventureStar: earnedAdventureStar,
              unlockedWorlds: unlockedWorlds.map((world) => ({ name: world.name, coinReward: world.coinReward, themeSlotReward: world.themeSlotReward })),
              worldRewardCoins,
              unusedBonusPoints,
              bonusUsed: roundBonusUsed,
              boxReward: null,
              xpGained,
              rankUps,
              rankUpCoins,
              treats: earnedTreats,
              petLevelUp,
              tickets: ticketsAfter - ticketsBefore,
              ticketsFull: ticketsAfter >= MAX_TICKETS
            });

            let rank = null;
            if (finalScore > 0) {
              const relevantScores = highscores.filter(h => sameLevel(h.level, level) && (h.mode || 'normal') === effectiveGameMode);
              let calculatedRank = 1;
              for (let s of relevantScores) {
                if (finalScore > s.score) break;
                calculatedRank++;
              }
              if (calculatedRank <= 10) rank = calculatedRank;
              setRoundRank(rank);

              try {
                await addDoc(collection(db, DB_COLLECTIONS.appHighscores), {
                  appId: APP_ID,
                  profileId: activeProfileId,
                  name: profile.name,
                  avatar: profile.avatar,
                  score: finalScore,
                  level: level,
                  mode: effectiveGameMode,
                  theme: currentThemeId,
                  timestamp: Date.now()
                });
              } catch (e) { console.error(e); }
            }

            const profileRef = doc(db, DB_COLLECTIONS.profiles, activeProfileId);
            try {
              await updateDoc(profileRef, {
                coins: (profile.coins || 0) + earnedCoins,
                stickers: updatedStickers,
                albumBonusUnlocked: albumBonusUnlocked || completedAlbumThisRound,
                adventureStars: (profile.adventureStars || 0) + earnedAdventureStar,
                xp: nextXp,
                treats: treats + earnedTreats,
                petLevels: nextPetLevels,
                tickets: ticketsAfter
              });
            } catch (e) {
              // Ohne catch würde die Runde im letzten Bildschirm hängen bleiben. Häufigste
              // Ursache: firestore.rules kennt ein neues Profil-Feld noch nicht (hasOnly).
              console.error('Profil speichern fehlgeschlagen:', e);
            }

            setScreen('result');
          };

          const advanceRound = (nextScore, nextStreak, delay, bonusUnusedAtEnd = false) => {
            setTimeout(() => {
              if (problemsDone + 1 >= MAX_PROBLEMS) {
                setProblemsDone(prev => prev + 1);
                handleGameEnd(nextScore, nextStreak, bonusUnusedAtEnd);
              } else {
                setProblemsDone(prev => prev + 1);
                generateProblem(level, effectiveGameMode, currentThemeId);
              }
            }, delay);
          };

          const checkAnswer = useCallback(() => {
            if (userAnswer === '' || feedback) return;
            // Bei der Uhrzeit sind immer vier Ziffern nötig. Ein zu frühes Tippen auf
            // den Haken soll keinen Versuch kosten - es passiert einfach nichts.
            if (problem.kind === 'clock' && userAnswer.length < 4) return;

            const isCorrect = isAnswerCorrect(userAnswer);

            if (isCorrect) {
              playSuccess();
              setFeedback('success');
              const perfectSolve = attemptsLeft === 3 ? calculatePerfectSolveBonus() : null;
              let pointsEarned = perfectSolve ? perfectSolve.pointsEarned : attemptsLeft === 2 ? 50 + (effectiveGameMode === 'gap' ? 20 : 0) : 20 + (effectiveGameMode === 'gap' ? 20 : 0);

              let currentStreak = perfectSolve ? perfectSolve.currentStreak : 0;
              setStreak(currentStreak);
              let comboBonus = perfectSolve ? perfectSolve.comboBonus : currentStreak >= 3 ? 30 : 0; 

              let speedBonus = 0;
              if (perfectSolve) speedBonus = perfectSolve.speedBonus;
              
              setLastBonusEarned(speedBonus + comboBonus);
              const newScore = score + pointsEarned + speedBonus + comboBonus;
              setScore(newScore);

              advanceRound(newScore, currentStreak, 2000, roundBonusAvailable);
            } else {
              playError();
              setStreak(0);
              if (attemptsLeft > 1) {
                setFeedback('error');
                setAttemptsLeft(prev => prev - 1);
                setUserAnswer('');
                setTimeout(() => setFeedback(null), 1200);
              } else {
                setFeedback('fatal');

                advanceRound(score, 0, 3500, roundBonusAvailable);
              }
            }
          }, [userAnswer, feedback, problem, isAnswerCorrect, playSuccess, attemptsLeft, effectiveGameMode, playError, score, roundBonusAvailable, calculatePerfectSolveBonus]);

          const useRoundBonusStar = useCallback(() => {
            if (!roundBonusAvailable || feedback) return;

            const { pointsEarned, currentStreak, comboBonus, speedBonus } = calculatePerfectSolveBonus();
            const totalBonusPoints = pointsEarned + comboBonus + speedBonus;

            playSuccess();
            setRoundBonusAvailable(false);
            setRoundBonusUsed(true);
            setStreak(currentStreak);
            setLastBonusEarned(speedBonus + comboBonus);
            setUserAnswer(String(getExpectedAnswer()));
            setFeedback('bonus');
            setScore(prev => prev + totalBonusPoints);

            advanceRound(score + totalBonusPoints, currentStreak, 1800, false);
          }, [roundBonusAvailable, feedback, calculatePerfectSolveBonus, playSuccess, getExpectedAnswer, score]);

          const handleInput = useCallback((val) => {
            if (feedback === 'success' || feedback === 'fatal' || feedback === 'bonus') return;
            playClick();
            setUserAnswer(prev => prev.length >= maxInputLength ? prev : prev + val);
          }, [feedback, playClick, maxInputLength]);

          const handleDelete = useCallback(() => {
            if (feedback === 'success' || feedback === 'fatal' || feedback === 'bonus') return;
            playClick();
            setUserAnswer('');
          }, [feedback, playClick]);

          // Tastatursteuerung
          const stateRef = useRef({ screen, checkAnswer, handleInput, handleDelete, useRoundBonusStar });
          useEffect(() => { stateRef.current = { screen, checkAnswer, handleInput, handleDelete, useRoundBonusStar }; }, [screen, checkAnswer, handleInput, handleDelete, useRoundBonusStar]);
          useEffect(() => {
            const handleKeyDown = (e) => {
              const { screen, checkAnswer, handleInput, handleDelete, useRoundBonusStar } = stateRef.current;
              if (screen !== 'game') return;
              if (e.key >= '0' && e.key <= '9') handleInput(e.key);
              else if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); }
              else if (e.key === 'Backspace' || e.key === 'Delete' || e.key.toLowerCase() === 'c') handleDelete();
              else if (e.key === '*') useRoundBonusStar();
            };
            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, []);

          const getOpSymbol = (op) => { switch(op) { case '*': return '×'; case '/': return '÷'; default: return op; } };
          const renderCalculatorButton = (label, onClick, customClass = null) => (
            <button key={label} onClick={onClick} className={`zs-key aspect-square rounded-xl text-3xl sm:text-4xl font-black flex items-center justify-center transition-all active:translate-y-2 active:shadow-none ${customClass ? customClass : theme.btnDefault}`}>
              {label}
            </button>
          );

          const renderPlaceholder = () => (
            <span className="text-blue-600 border-b-[6px] border-blue-600 min-w-[1.2em] inline-block text-center pb-1 leading-none mx-1">
              {userAnswer === '' ? '\u00A0' : userAnswer}
            </span>
          );

          // --- TIER-DARSTELLUNG ---
          // Wichtig: die Lauf-Animation sitzt auf dem äußeren Container, das
          // Kunststück auf dem inneren Element. Sonst würde das Tier beim Trick
          // an den linken Rand zurückspringen.
          const renderPetCompanion = (pet, options) => {
            if (!pet) return null;
            const opts = options || {};
            const levelInfo = getPetLevel(petLevels[pet.id] || 0);
            const accessory = getAccessoryById(petOutfits[pet.id]);
            const trick = petTrick && petTrick.petId === pet.id ? petTrick : null;
            // Standard: das Tier läuft oben über den farbigen Bogen. Dort liegt kein
            // Knopf - am Kartenboden verdeckte es je nach Bildschirmhöhe den LOS-Knopf
            // oder die Menü-Kacheln und fing deren Antippen ab.
            const style = opts.style || { top: (44 + (pet.lane || 0) * 18) + 'px' };

            return (
              <div
                key={pet.id}
                className={`absolute left-0 z-20 ${pet.motionClass}`}
                style={style}
              >
                <div className="relative">
                  {trick && trick.phrase && (
                    <div className={`absolute left-1/2 -translate-x-1/2 whitespace-nowrap bg-white/95 border-2 border-gray-200 rounded-2xl px-2 py-0.5 text-[11px] font-bold text-gray-700 shadow-md animate-pop-in ${opts.bubbleAbove ? 'bottom-full mb-1' : 'top-full mt-1'}`}>
                      {trick.phrase}
                    </div>
                  )}
                  <button
                    onClick={() => runPetTrick(pet, false)}
                    title={pet.name + ' antippen'}
                    aria-label={pet.name + ' antippen'}
                    className={`relative block leading-none ${opts.sizeClass || 'text-5xl'} ${trick ? trick.trickClass : ''}`}
                  >
                    {pet.icon}
                    {accessory && (
                      <span className="absolute -top-2 left-1/2 -translate-x-1/2 text-2xl pointer-events-none">{accessory.icon}</span>
                    )}
                  </button>
                  {trick && trick.coins > 0 && (
                    <span className="absolute -top-3 -right-3 text-lg animate-pet-sparkle pointer-events-none">🪙</span>
                  )}
                  {levelInfo.level > 1 && (
                    <span className="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-white/90 border border-emerald-300 rounded-full px-1.5 text-[10px] font-black text-emerald-700 pointer-events-none">
                      {levelInfo.level}
                    </span>
                  )}
                </div>
              </div>
            );
          };

          const renderRankBar = () => (
            <div className="mb-3 bg-indigo-50 border-2 border-indigo-100 rounded-2xl px-3 py-2 text-left">
              <div className="flex items-center justify-between gap-2 mb-1">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="text-xl shrink-0">{rankInfo.icon}</span>
                  <span className="font-black text-indigo-900 text-sm truncate">Rang {rankInfo.rank} - {rankInfo.title}</span>
                </div>
                <span className="text-[11px] font-bold text-indigo-500 shrink-0 whitespace-nowrap">{rankInfo.into} / {rankInfo.need} XP</span>
              </div>
              <div className="h-2.5 bg-indigo-100 rounded-full overflow-hidden">
                <div className="h-full bg-indigo-500 rounded-full transition-all duration-500" style={{ width: (rankInfo.progress * 100).toFixed(1) + '%' }}></div>
              </div>
            </div>
          );

          // --- RENDER HILFS-KOMPONENTEN ---
          const TopBar = () => {
            if (!profile || screen === 'setup' || screen === 'profile_select') return null; 
            return (
              <div className="absolute top-0 left-0 w-full p-4 flex justify-between items-start z-50 pointer-events-none" style={{ paddingLeft: 68 }}>
                <button onClick={() => { setActiveProfileId(null); setScreen('profile_select'); playClick(); }} className="relative bg-white/90 backdrop-blur-sm rounded-full px-4 py-2 flex items-center gap-2 shadow-md hover:bg-sky-50 transition-colors pointer-events-auto border-2 border-white/50 animate-slide-up">
                  <span className="text-2xl">{profile.avatar}</span>
                  {/* Rang-Abzeichen am Avatar: kostet keine Breite in der Leiste. */}
                  <span className="absolute -top-1 left-6 bg-indigo-500 text-white text-[10px] font-black rounded-full px-1.5 border-2 border-white shadow-sm" title={'Rang ' + rankInfo.rank + ' - ' + rankInfo.title}>
                    {rankInfo.rank}
                  </span>
                  {/* Früher hidden sm:inline - der Name war auf Handys immer versteckt,
                      obwohl die Design-Fläche (448px) genug Platz hat. */}
                  <span className="font-bold text-gray-800 max-w-[6rem] truncate">{profile.name}</span>
                  <Users size={16} className="text-sky-500 ml-1" />
                </button>
                <div className="flex items-center gap-2">
                  {treats > 0 && (
                    <div className="bg-orange-200 rounded-full px-3 py-2 flex items-center gap-1 shadow-md pointer-events-auto border-2 border-orange-100 animate-slide-up" title="Leckerli für deine Tiere">
                      <span className="font-black text-orange-900">{treats}</span>
                      <span className="text-lg">🍖</span>
                    </div>
                  )}
                  {fullscreen.supported && (
                    <button
                      onClick={() => { playClick(); fullscreen.toggle(); }}
                      className="bg-white/90 rounded-full p-2.5 shadow-md hover:bg-sky-50 transition-colors pointer-events-auto border-2 border-white/50 animate-slide-up text-gray-700"
                      title={fullscreen.isFullscreen ? 'Vollbild beenden' : 'Vollbild'}
                      aria-label={fullscreen.isFullscreen ? 'Vollbild beenden' : 'Vollbild'}
                    >
                      {fullscreen.isFullscreen ? <Minimize size={18} /> : <Maximize size={18} />}
                    </button>
                  )}
                  <div className="bg-yellow-400 rounded-full px-4 py-2 flex items-center gap-2 shadow-md pointer-events-auto border-2 border-yellow-200 animate-slide-up">
                    <span className="font-black text-yellow-900 text-lg">{profile.coins}</span>
                    <span className="text-xl">🪙</span>
                  </div>
                </div>
              </div>
            );
          };

          const { scale: appScale, height: CANVAS_HEIGHT, compact } = useAppScale();
          const CANVAS_WIDTH = DESIGN_WIDTH;
          const fullscreen = useFullscreen();

          const renderScreenContent = () => {
            if (isLoadingProfile || screen === 'loading') {
              return <div className="font-bold text-xl text-sky-800">Lade...</div>;
            }

            if (screen === 'profile_select') {
              return (
                <div className="bg-white rounded-[2rem] shadow-2xl w-full p-8 text-center animate-pop-in border-4 border-sky-300 flex flex-col max-h-full">
                  <h1 className="text-3xl font-extrabold text-sky-600 mb-6 shrink-0">Wer spielt gerade?</h1>
                  <div className="grid grid-cols-2 gap-4 mb-6 overflow-y-auto p-1 flex-1">
                    {profiles.map(p => (
                      <button
                        key={p.id}
                        onClick={() => { setActiveProfileId(p.id); setCurrentThemeId(p.activeTheme || 'classic'); setScreen('start'); playClick(); }}
                        className="bg-gray-50 hover:bg-sky-50 border-2 border-gray-200 hover:border-sky-300 rounded-2xl p-4 flex flex-col items-center gap-3 transition-all active:scale-95 shadow-sm"
                      >
                        <div className="text-5xl">{p.avatar}</div>
                        <div className="font-bold text-gray-800 text-lg truncate w-full">{p.name}</div>
                      </button>
                    ))}
                  </div>
                  <button
                    onClick={() => { setScreen('setup'); playClick(); }}
                    className="shrink-0 w-full bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-colors border-2 border-sky-200 border-dashed"
                  >
                    <Users size={20} /> Neuen Spieler hinzufügen
                  </button>
                </div>
              );
            }

            if (screen === 'setup') {
              return (
                <div className="bg-white rounded-[2rem] shadow-2xl w-full p-8 text-center animate-pop-in border-4 border-sky-300 flex flex-col max-h-full overflow-y-auto">
                  <h1 className="text-3xl font-extrabold text-sky-600 mb-2">Wer bist du?</h1>
                  <p className="text-gray-500 font-medium mb-6 text-sm">Tipp: Wenn du schon auf einem anderen Gerät gespielt hast, benutze genau denselben Namen!</p>

                  <div className="mb-6">
                    <label className="block text-left font-bold text-gray-700 mb-2">Dein Name:</label>
                    <input
                      type="text"
                      maxLength={12}
                      value={setupName}
                      onChange={(e) => setSetupName(e.target.value)}
                      placeholder="z.B. Leo"
                      className="w-full bg-gray-50 border-2 border-sky-200 rounded-xl px-4 py-3 font-bold text-gray-800 text-xl focus:outline-none focus:border-sky-500 transition-colors"
                    />
                  </div>

                  <div className="mb-8">
                    <label className="block text-left font-bold text-gray-700 mb-2">Wähle dein Tier:</label>
                    <div className="grid grid-cols-5 gap-2 bg-gray-50 p-3 rounded-xl border-2 border-gray-100">
                      {AVATAR_POOL.map((avatar) => (
                        <button key={avatar} onClick={() => { playClick(); setSetupAvatar(avatar); }} className={`aspect-square text-3xl flex items-center justify-center rounded-lg transition-all ${setupAvatar === avatar ? 'bg-sky-200 scale-110 shadow-sm' : 'hover:bg-gray-200 grayscale-0 opacity-70 hover:opacity-100'}`}>
                          {avatar}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button onClick={saveProfile} disabled={!setupName.trim()} className="w-full bg-green-500 hover:bg-green-600 disabled:bg-gray-300 disabled:translate-y-0 text-white font-black text-xl py-4 rounded-2xl shadow-[0_6px_0_0_rgb(21,128,61)] disabled:shadow-none active:shadow-none active:translate-y-2 transition-all">
                    Start!
                  </button>

                  {profiles.length > 0 && (
                    <button onClick={() => setScreen('profile_select')} className="mt-4 text-gray-500 font-bold hover:text-gray-700 underline">Abbrechen</button>
                  )}
                </div>
              );
            }

            if (screen === 'start') {
              return (
                <div className="zs-card bg-white rounded-[2rem] shadow-2xl w-full p-6 sm:p-8 text-center relative overflow-hidden transition-colors duration-500 flex flex-col max-h-full">
                  <div className={`absolute top-0 left-0 w-full h-32 ${theme.deviceBg} rounded-b-[50%] -translate-y-10 transition-colors duration-500`}></div>
                  {renderPetCompanion(activePet)}

                  <div className="relative z-10 flex-1 overflow-y-auto pb-2">
                    <div className="w-28 h-28 mx-auto bg-white rounded-full border-4 border-white shadow-lg mb-4 flex items-center justify-center text-6xl animate-float">{theme.emojis.title}</div>
                    <h1 className="text-4xl font-extrabold text-gray-800 mb-2 tracking-tight">Zahlen<span className={`${theme.textMain}`}>Safari</span></h1>

                    <div className="flex justify-center flex-wrap gap-2 mb-4 mt-2">
                      {Object.values(THEMES).filter(t => profile?.unlockedThemes.includes(t.id)).map((t) => (
                        <button key={t.id} onClick={() => changeTheme(t.id)} title={t.name} className={`w-12 h-12 rounded-full flex items-center justify-center text-2xl transition-transform ${currentThemeId === t.id ? 'scale-110 ring-4 ring-offset-2 ring-gray-300 z-10 shadow-md' : 'opacity-60 hover:opacity-100 hover:scale-105'} ${t.deviceBg}`}>
                          {t.icon}
                        </button>
                      ))}
                    </div>

                    {renderRankBar()}

                    <div className="flex bg-gray-100 rounded-xl p-1 mb-4 shadow-inner">
                      <button onClick={() => { playClick(); setGameMode('normal'); }} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${effectiveGameMode === 'normal' ? 'bg-white shadow text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>Normal (A+B=?)</button>
                      <button
                        onClick={() => { playClick(); setGameMode('gap'); }}
                        disabled={getLevelInfo(level).noGap}
                        title={getLevelInfo(level).noGap ? 'In diesem Level gibt es keine Lücken-Aufgaben' : 'Lücken-Aufgaben bringen Extra-Punkte!'}
                        className={`flex-1 py-2 text-sm font-bold rounded-lg transition-colors flex items-center justify-center gap-1 ${getLevelInfo(level).noGap ? 'text-gray-300' : effectiveGameMode === 'gap' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                      >
                        Lücken (A+?=C) <HelpCircle size={14}/>
                      </button>
                    </div>

                    {/* Zwei Spalten: mit acht Stufen wäre eine Spalte so hoch, dass der
                        LOS-Knopf aus dem Bild rutscht. Die ausführliche Erklärung steht
                        darunter - immer nur für die gewählte Stufe. */}
                    <div className="grid grid-cols-2 gap-1.5">
                      {LEVELS.map((item) => (
                        <button key={item.id} onClick={() => { playClick(); setLevel(item.id); }} title={item.desc} className={`py-1.5 px-2 rounded-xl border-2 font-bold text-left text-sm flex items-center transition-all ${sameLevel(level, item.id) ? 'bg-gray-100 border-gray-400 text-gray-800 shadow-md' : 'border-gray-100 text-gray-400 hover:bg-gray-50'}`}>
                          <div className={`w-6 h-6 shrink-0 rounded-full flex items-center justify-center mr-2 text-xs ${sameLevel(level, item.id) ? theme.deviceBg + ' text-white font-black' : 'bg-gray-200 text-gray-500'}`}>{item.label}</div>
                          <span className="truncate">{item.short}</span>
                        </button>
                      ))}
                    </div>
                    <p className="text-xs font-bold text-gray-500 mt-2 mb-4">{getLevelInfo(level).desc}</p>

                    <button onClick={startGame} className="w-full bg-green-500 hover:bg-green-600 text-white font-black text-2xl py-4 rounded-2xl shadow-[0_8px_0_0_rgb(21,128,61)] active:shadow-none active:translate-y-2 transition-all flex items-center justify-center gap-3 mb-4">
                      <Play fill="currentColor" size={28} /> LOS!
                    </button>

                    <div className="grid gap-2 grid-cols-3">
                      <button onClick={() => { playClick(); setScreen('highscores'); }} className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-colors"><Trophy size={20} className="text-yellow-600"/> <span className="text-xs">Bestenliste</span></button>
                      <button onClick={() => { playClick(); setScreen('shop'); }} className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-colors"><ShoppingCart size={20} className="text-blue-500"/> <span className="text-xs">Shop</span></button>
                      <button onClick={() => { playClick(); setScreen('stickers'); }} className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-colors"><BookOpen size={20} className="text-pink-500"/> <span className="text-xs">Sticker</span></button>
                      <a href={'../zahlen-flieger/index.html?profile=' + encodeURIComponent(activeProfileId)} onClick={playClick} className="font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-colors bg-sky-100 hover:bg-sky-200 text-sky-900"><span className="text-xl">🐤</span> <span className="text-xs">Flieger · {getTickets(profile)} 🎟️</span></a>
                      {ownedPets.length > 0 && <button onClick={() => { playClick(); setScreen('pets'); }} className="font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-colors bg-emerald-100 hover:bg-emerald-200 text-emerald-900"><span className="text-xl">🐾</span> <span className="text-xs">Gehege</span></button>}
                      {fullStickerAlbum && <button onClick={() => { playClick(); setScreen('adventure'); }} className="font-bold py-3 rounded-xl flex flex-col items-center justify-center gap-1 transition-colors bg-amber-100 hover:bg-amber-200 text-amber-900"><span className="text-xl">🗺️</span> <span className="text-xs">Abenteuerbuch</span></button>}
                    </div>
                  </div>
                </div>
              );
            }

            if (screen === 'shop') {
              const atThemeLimit = ownedRegularThemeCount >= maxOwnedThemesAllowed;
              const allBoxesOpened = surpriseRewardIds.length >= SURPRISE_REWARDS.length;
              const allThemes = Object.values(THEMES);
              const regularThemes = allThemes.filter((t) => !isSeasonalTheme(t)).sort((a, b) => a.price - b.price);
              const seasonalThemes = allThemes.filter((t) => isSeasonalTheme(t) && isThemeInShop(t));
              // Saison vorbei, aber schon gekauft: weiter anzeigen, damit man das Theme
              // umschalten oder verkaufen kann.
              const keptSeasonalThemes = allThemes.filter((t) => isSeasonalTheme(t) && !isThemeInShop(t) && profile.unlockedThemes.includes(t.id));

              const renderThemeRow = (t) => {
                const seasonal = isSeasonalTheme(t);
                const season = seasonal ? SEASONS[t.season] : null;
                const isOwned = profile.unlockedThemes.includes(t.id);
                const isClassic = t.id === 'classic';
                const blockedBySlots = !seasonal && atThemeLimit;
                const buyable = seasonal ? isThemeInShop(t) : true;
                const canBuy = profile.coins >= t.price && !blockedBySlots && buyable;

                return (
                  <div key={t.id} className={`flex items-center justify-between p-3 rounded-xl border-2 transition-all ${isOwned ? 'bg-green-50 border-green-200' : seasonal ? 'bg-white border-fuchsia-200' : 'bg-white border-gray-200'}`}>
                    <div className="flex items-center gap-3 min-w-0">
                      <div className={`w-12 h-12 shrink-0 rounded-full flex items-center justify-center text-2xl ${t.deviceBg}`}>{t.icon}</div>
                      <div className="min-w-0">
                        <div className="font-bold text-gray-800 truncate">{t.name}</div>
                        {!isOwned && <div className="text-sm font-bold text-yellow-600 flex items-center gap-1">{t.price} 🪙</div>}
                        {isOwned && <div className="text-sm font-bold text-green-600 flex items-center gap-1"><Check size={20} strokeWidth={3}/></div>}
                        {season && !isOwned && <div className="text-[11px] font-bold text-fuchsia-600">nur bis {formatMonthDay(season.to)}</div>}
                      </div>
                    </div>

                    {!isOwned ? (
                      <button
                        onClick={() => buyTheme(t)}
                        disabled={!canBuy}
                        aria-label="Theme kaufen"
                        title={canBuy ? 'Kaufen' : blockedBySlots ? `Maximal ${maxOwnedThemesAllowed} Themes gleichzeitig` : 'Nicht genug Münzen'}
                        className={`shrink-0 w-10 h-10 rounded-lg font-bold shadow-sm flex items-center justify-center transition-all ${canBuy ? 'bg-blue-500 hover:bg-blue-600 text-white' : 'bg-gray-200 text-gray-400'}`}
                      >
                        {canBuy ? <ShoppingCart size={16}/> : <Lock size={16}/>}
                      </button>
                    ) : (
                      <div className="flex items-center gap-2 shrink-0">
                        <button onClick={() => changeTheme(t.id)} className={`px-4 py-2 rounded-lg font-bold transition-all ${currentThemeId === t.id ? 'bg-green-500 text-white shadow-inner' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
                          {currentThemeId === t.id ? 'Aktiv' : 'Wählen'}
                        </button>
                        {!isClassic && (
                          <button
                            onClick={() => sellTheme(t)}
                            aria-label="Theme verkaufen"
                            className="w-10 h-10 rounded-lg font-bold transition-all bg-yellow-100 text-yellow-800 hover:bg-yellow-200 flex items-center justify-center"
                            title={`Verkaufen für ${Math.floor(t.price * 0.5)} Münzen`}
                          >
                            💸
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                );
              };

              return (
                <div className="zs-card bg-white rounded-[2rem] shadow-2xl w-full p-6 sm:p-8 animate-pop-in flex flex-col max-h-full">
                  <div className="text-center mb-4">
                    <div className="w-16 h-16 mx-auto bg-blue-100 rounded-full flex items-center justify-center mb-2 shadow-inner text-blue-500"><ShoppingCart size={32} /></div>
                    <h2 className="text-3xl font-extrabold text-gray-800">Shop</h2>
                    <p className="text-sm font-bold text-blue-600 mt-1">Themes im Besitz: {ownedRegularThemeCount} / {maxOwnedThemesAllowed}</p>
                    {extraThemeSlots > 0 && <p className="text-xs font-bold text-emerald-600">+{extraThemeSlots} Extra-Slots aus dem Abenteuerbuch</p>}
                  </div>

                  <div className="flex-1 overflow-y-auto mb-4 space-y-4 pr-1">
                    {/* --- SAISON --- */}
                    {seasonalThemes.length > 0 && (
                      <div className="bg-fuchsia-50 rounded-2xl border-2 border-fuchsia-200 p-4">
                        <div className="font-black text-fuchsia-900 mb-1">{SEASONS[seasonalThemes[0].season].icon} {SEASONS[seasonalThemes[0].season].name}</div>
                        <p className="text-xs font-bold text-fuchsia-700 mb-3">Nur in dieser Jahreszeit im Shop! Saison-Themes brauchen keinen Theme-Slot.</p>
                        <div className="space-y-3">
                          {seasonalThemes.map(renderThemeRow)}
                        </div>
                      </div>
                    )}

                    {/* --- KISTEN --- */}
                    <div className="bg-fuchsia-50 rounded-2xl border-2 border-fuchsia-200 p-4 space-y-3">
                      <div className="flex items-center justify-between gap-3">
                        <div className="text-left min-w-0">
                          <div className="font-black text-fuchsia-900">Überraschungskiste</div>
                          <div className="text-xs font-bold text-fuchsia-700">Gesammelt: {surpriseRewardIds.length} / {SURPRISE_REWARDS.length}</div>
                        </div>
                        <button
                          onClick={buySurpriseBox}
                          disabled={profile.coins < SURPRISE_BOX_PRICE || allBoxesOpened}
                          className={`shrink-0 rounded-2xl px-4 py-3 font-black transition-all ${profile.coins >= SURPRISE_BOX_PRICE && !allBoxesOpened ? 'bg-fuchsia-500 hover:bg-fuchsia-600 text-white shadow-[0_6px_0_0_rgb(192,38,211)] active:shadow-none active:translate-y-2' : 'bg-gray-200 text-gray-400'}`}
                        >
                          🎁 {SURPRISE_BOX_PRICE} 🪙
                        </button>
                      </div>
                      {allBoxesOpened && <div className="text-xs font-bold text-emerald-700">Alle Tiere und Knöpfe sind gefunden!</div>}

                      <div className="flex items-center justify-between gap-3 border-t-2 border-fuchsia-100 pt-3">
                        <div className="text-left min-w-0">
                          <div className="font-black text-orange-900">Leckerli-Kiste</div>
                          <div className="text-xs font-bold text-orange-700">{TREATS_PER_BOX} Leckerli - du hast {treats}</div>
                        </div>
                        <button
                          onClick={buyTreatBox}
                          disabled={profile.coins < TREAT_BOX_PRICE}
                          className={`shrink-0 rounded-2xl px-4 py-3 font-black transition-all ${profile.coins >= TREAT_BOX_PRICE ? 'bg-orange-500 hover:bg-orange-600 text-white shadow-[0_6px_0_0_rgb(234,88,12)] active:shadow-none active:translate-y-2' : 'bg-gray-200 text-gray-400'}`}
                        >
                          🍖 {TREAT_BOX_PRICE} 🪙
                        </button>
                      </div>
                    </div>

                    {/* --- TIER-ZUBEHÖR --- */}
                    {ownedPets.length > 0 && (
                      <div className="bg-emerald-50 rounded-2xl border-2 border-emerald-200 p-4">
                        <div className="font-black text-emerald-900 mb-1">🐾 Tier-Zubehör</div>
                        <p className="text-xs font-bold text-emerald-700 mb-3">Im Gehege ziehst du es deinen Tieren an.</p>
                        <div className="grid grid-cols-3 gap-2">
                          {PET_ACCESSORIES.map((acc) => {
                            const owned = ownedAccessoryIds.includes(acc.id);
                            const canBuy = !owned && profile.coins >= acc.price;
                            return (
                              <button
                                key={acc.id}
                                onClick={() => buyAccessory(acc)}
                                disabled={owned || !canBuy}
                                title={owned ? acc.name + ' (gekauft)' : acc.name + ' für ' + acc.price + ' Münzen'}
                                className={`rounded-xl p-2 border-2 flex flex-col items-center gap-0.5 transition-all ${owned ? 'bg-green-100 border-green-300' : canBuy ? 'bg-white border-emerald-200 hover:bg-emerald-100 active:scale-95' : 'bg-gray-100 border-gray-200 opacity-60'}`}
                              >
                                <span className="text-2xl leading-none">{acc.icon}</span>
                                <span className="text-[10px] font-bold text-gray-600 truncate w-full text-center">{acc.name}</span>
                                <span className={`text-[10px] font-black ${owned ? 'text-green-700' : 'text-yellow-600'}`}>{owned ? 'gekauft' : acc.price + ' 🪙'}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {/* --- THEMES --- */}
                    <div className="bg-gray-50 rounded-2xl p-4 border-2 border-gray-100 space-y-3">
                      {regularThemes.map(renderThemeRow)}
                      {keptSeasonalThemes.map(renderThemeRow)}
                    </div>
                  </div>

                  <button
                    onClick={() => { playClick(); setScreen('start'); }}
                    className="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-4 rounded-2xl flex items-center justify-center transition-colors"
                    aria-label="Zurück zur Startseite"
                    title="Zurück"
                  >
                    <ArrowLeft size={20} />
                  </button>
                </div>
              );
            }

            if (screen === 'pets') {
              return (
                <div className="zs-card bg-white rounded-[2rem] shadow-2xl w-full p-6 sm:p-8 animate-pop-in flex flex-col max-h-full">
                  <div className="text-center mb-3">
                    <h2 className="text-3xl font-extrabold text-gray-800">Tier-Gehege</h2>
                    <p className="text-gray-500 font-medium text-sm">Antippen für Kunststücke, füttern für neue Stufen.</p>
                  </div>

                  {/* Alle Tiere laufen gleichzeitig herum. Die Bahnen werden hier per
                      Inline-Stil gesetzt, weil die Kiste flacher ist als im Menü. Die
                      negative animation-delay verteilt sie sofort über die Wiese -
                      ohne sie würden alle gemeinsam links am Rand starten. */}
                  <div className="relative h-36 shrink-0 rounded-2xl overflow-hidden bg-gradient-to-b from-sky-200 to-emerald-200 border-2 border-emerald-300 mb-3">
                    {ownedPets.map((pet, index) => renderPetCompanion(pet, {
                      sizeClass: 'text-3xl',
                      bubbleAbove: true,
                      style: { bottom: (4 + (index % 4) * 24) + 'px', animationDelay: '-' + (index * 3.1).toFixed(1) + 's' }
                    }))}
