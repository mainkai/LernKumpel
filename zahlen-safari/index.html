                <div className={`${theme.deviceBg} rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] w-full border-8 ${theme.deviceBorder} overflow-hidden flex flex-col transition-colors duration-500 ${feedback === 'error' || feedback === 'fatal' ? 'animate-shake' : ''}`}>
                  <div className={`${theme.bandBg} py-2 px-6 flex justify-between items-center text-gray-300 transition-colors duration-500`}>
                    <div className="font-black text-sm tracking-widest uppercase flex items-center gap-2"><Calculator size={16} /> ZAHLEN SAFARI {albumBonusUnlocked && <button onClick={useRoundBonusStar} disabled={!roundBonusAvailable || Boolean(feedback)} className={`text-2xl leading-none transition-all ${roundBonusAvailable && !feedback ? 'animate-float hover:scale-110 active:scale-95' : 'opacity-30 grayscale cursor-default'}`} aria-label="Bonus-Stern einsetzen" title={roundBonusAvailable ? 'Bonus-Stern einsetzen' : 'Bonus-Stern schon verbraucht'}>⭐</button>}</div>
                    <div className="flex gap-1.5">
                      {[...Array(MAX_ATTEMPTS)].map((_, i) => (
                        <div key={i} className={`w-4 h-4 rounded-full border-2 border-black/30 ${i < attemptsLeft ? 'bg-green-500 shadow-[0_0_8px_rgb(34,197,94)]' : 'bg-white/20'}`} />
                      ))}
                    </div>
                  </div>

                  <div className={`relative p-4 sm:p-6 ${theme.deviceBg} transition-colors duration-500`}>
                    <div className={`${theme.displayBg} border-8 ${theme.displayBorder} rounded-2xl p-4 shadow-inner relative h-48 zs-display flex flex-col justify-between overflow-hidden transition-colors duration-500`}>
                      <div className="flex justify-between items-start text-gray-800 font-mono text-xs sm:text-sm font-bold opacity-70 z-10">
                        <div>Lvl {getLevelInfo(level).label} {effectiveGameMode === 'gap' ? '(Lücken)' : ''} | Aufg. {problemsDone + 1}/{MAX_PROBLEMS}</div>
                        <div className="flex items-center gap-2">
                          {streak >= 3 && <span className="text-orange-600 animate-pulse drop-shadow-sm" title={`${streak} in Folge richtig!`}>🔥 x{streak}</span>}
                          <div>Pkte: {score}</div>
                        </div>
                      </div>

                      {!feedback && problem.kind === 'arith' && (
                        <div className="absolute top-[35%] left-3 sm:left-6 transform -translate-y-1/2 text-4xl sm:text-5xl animate-float opacity-50 z-0 pointer-events-none">{problem.icon}</div>
                      )}

                      {feedback === 'success' && (
                        <div className={`absolute inset-0 flex flex-col items-center justify-center ${theme.displayBg} z-20 animate-pop-in`}>
                          <div className="text-6xl mb-1 animate-bounce">{theme.emojis.success}</div>
                          <div className="font-bold text-xl text-green-800 uppercase tracking-widest">Richtig!</div>
                          {lastBonusEarned > 0 && (
                            <div className="mt-1 bg-yellow-400 text-yellow-900 text-xs font-black px-3 py-1 rounded-full animate-slide-up flex items-center gap-1 shadow-sm">
                              <Zap size={14} fill="currentColor" /> +{lastBonusEarned} Bonus!
                            </div>
                          )}
                        </div>
                      )}

                      {feedback === 'error' && (
                        <div className={`absolute inset-0 flex items-center justify-center ${theme.displayBg} z-20`}>
                          <div className="text-center animate-pulse">
                            <div className="text-6xl mb-1">{theme.emojis.retry}</div>
                            <div className="font-bold text-xl text-red-800 uppercase tracking-widest">Versuch's nochmal!</div>
                          </div>
                        </div>
                      )}

                      {feedback === 'fatal' && (
                        <div className={`absolute inset-0 flex flex-col items-center justify-center ${theme.displayBg} z-20 animate-pop-in`}>
                          <div className="text-5xl mb-1">{theme.emojis.fatal}</div>
                          <div className="font-bold text-lg text-gray-800">Die Lösung ist:</div>
                          <div className="font-mono text-4xl text-red-800 font-black">{formatSolution()}</div>
                        </div>
                      )}

                      {feedback === 'bonus' && (
                        <div className={`absolute inset-0 flex flex-col items-center justify-center ${theme.displayBg} z-20 animate-pop-in`}>
                          <div className="text-6xl mb-1">⭐</div>
                          <div className="font-bold text-lg text-amber-900 uppercase tracking-widest">Weiter geht's</div>
                          <div className="font-mono text-4xl text-amber-900 font-black mt-1">{formatSolution()}</div>
                        </div>
                      )}

                      {problem.kind === 'clock' && (
                        <div className={`flex items-center justify-between gap-2 z-10 mt-auto ${feedback ? 'opacity-0' : 'opacity-100'}`}>
                          <AnalogClock hour={problem.hour} minute={problem.minute} size={compact ? 88 : 108} />
                          <div className="text-right">
                            <div className="text-[10px] font-bold text-gray-600 uppercase tracking-wider">Wie viel Uhr ist es?</div>
                            <div className="font-mono text-4xl sm:text-5xl font-black text-blue-700 tracking-tight">{formatTimeInput(userAnswer)}</div>
                            <div className="text-[10px] font-bold text-gray-500">immer 4 Ziffern (z.B. 0 7 3 0)</div>
                          </div>
                        </div>
                      )}

                      {problem.kind === 'money' && (
                        <div className={`z-10 mt-auto ${feedback ? 'opacity-0' : 'opacity-100'}`}>
                          <div className="text-[11px] font-bold text-gray-700 leading-snug text-left">{moneyQuestion}</div>
                          <div className="font-mono text-xl sm:text-2xl font-black text-gray-800 text-right">{moneyExpression}</div>
                          <div className="font-mono text-3xl sm:text-4xl font-black text-blue-700 text-right leading-tight">= {formatMoneyInput(userAnswer)}</div>
                          <div className="text-[10px] font-bold text-gray-500 text-right">in Cent tippen (2,00 € = 200)</div>
                        </div>
                      )}

                      {problem.kind !== 'clock' && problem.kind !== 'money' && (
                        <div className={`text-right font-mono text-4xl sm:text-5xl font-black text-gray-800 tracking-tight z-10 mt-auto ${feedback ? 'opacity-0' : 'opacity-100'}`}>
                          {problem.missingPart === 'num1' ? renderPlaceholder() : problem.num1}
                          {' '}{getOpSymbol(problem.op)}{' '}
                          {problem.missingPart === 'num2' ? renderPlaceholder() : problem.num2}
                          <br className="sm:hidden" /> = {' '}
                          {problem.missingPart === 'answer' ? renderPlaceholder() : problem.answer}
                        </div>
                      )}
                    </div>

                  </div>

                  <div className={`${theme.numpadBg} p-4 sm:p-6 rounded-b-2xl transition-colors duration-500`}>
                    <div className="grid grid-cols-3 gap-3 sm:gap-4">
                      {renderCalculatorButton('7', () => handleInput('7'))} {renderCalculatorButton('8', () => handleInput('8'))} {renderCalculatorButton('9', () => handleInput('9'))}
                      {renderCalculatorButton('4', () => handleInput('4'))} {renderCalculatorButton('5', () => handleInput('5'))} {renderCalculatorButton('6', () => handleInput('6'))}
                      {renderCalculatorButton('1', () => handleInput('1'))} {renderCalculatorButton('2', () => handleInput('2'))} {renderCalculatorButton('3', () => handleInput('3'))}
                      {renderCalculatorButton('C', handleDelete, theme.btnDelete)} {renderCalculatorButton('0', () => handleInput('0'))}
                      <button onClick={checkAnswer} className={`zs-key aspect-square rounded-xl text-2xl font-black flex flex-col items-center justify-center active:translate-y-2 active:shadow-none transition-all ${theme.btnAction}`}>
                        <Check size={32} strokeWidth={4} /><span className="text-sm"></span>
                      </button>
                    </div>

                    {/* Spielzeug-Knöpfe. Lagen früher (in Prozent) über der Anzeige und
                        verdeckten dort die Aufgabe - vor allem auf kleinen Displays.
                        Eine Reihe mit dem Menü-Knopf: absolut positioniert würden sich
                        die inzwischen fünf Knöpfe mit der Menü-Schrift überlappen. */}
                    <div className={`zs-menu mt-8 flex items-center gap-2 ${ownedToyButtons.length > 0 ? 'justify-between' : 'justify-center'}`}>
                      {ownedToyButtons.length > 0 && (
                        <div className="flex items-center gap-1.5 shrink-0">
                          {ownedToyButtons.map((reward) => (
                            <button
                              key={reward.id}
                              onClick={() => playToyButtonReward(reward)}
                              className="w-8 h-8 rounded-full bg-white/85 border-2 border-white shadow-lg text-lg flex items-center justify-center hover:scale-110 active:scale-95 transition-transform"
                              title={reward.name}
                              aria-label={reward.name}
                            >
                              {reward.icon}
                            </button>
                          ))}
                        </div>
                      )}
                      <button onClick={() => { playClick(); setScreen('start'); }} className="shrink-0 text-white/60 hover:text-white flex items-center justify-center gap-2 transition-colors font-bold uppercase tracking-wider text-sm">
                        <ArrowLeft size={18} /> Menü
                      </button>
                    </div>
                  </div>
                </div>
              );
            }

            return null;
          };

          const isNeutralBg = !user || screen === 'profile_select' || screen === 'setup' || screen === 'loading';

          return (
            <div className={`fixed inset-0 flex items-center justify-center overflow-hidden transition-colors duration-500 ${isNeutralBg ? 'bg-sky-200' : theme.pageBg} font-sans`}>
              <div
                style={{
                  width: `${CANVAS_WIDTH}px`,
                  height: `${CANVAS_HEIGHT}px`,
                  transform: `scale(${appScale})`,
                  transformOrigin: 'center'
                }}
                // shrink-0: ohne das quetscht der Flex-Container die feste
                // Design-Breite zusammen und die Skalierung wirkt doppelt.
                className={`relative flex flex-col shrink-0 ${compact ? 'zs-compact' : ''}`}
              >
                <TopBar />
                <div className="zs-stage flex-1 w-full flex flex-col items-center justify-center pt-20 pb-4 px-2 sm:px-4 min-h-0">
                  {renderScreenContent()}
                </div>
              </div>
            </div>
          );
        }

        const rootEl = document.getElementById('root');
        rootEl.removeAttribute('style');
        rootEl.textContent = '';
        const root = ReactDOM.createRoot(rootEl);
        root.render(<App />);
        window.__appStarted = true;
    </script>
</body>
</html>
